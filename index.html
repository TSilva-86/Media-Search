<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Media Search</title>
  <style>
    :root {
      --bg-color: #000000;
      --card-bg: #121212;
      --card-hover: #181818;
      --primary-color: #28a745;
      --primary-hover: #218838;
      --text-color: #ffffff;
      --text-muted: #bbbbbb;
      --border-color: #333333;
      --error-color: #ff4d4d;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: Arial, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    #loginContainer {
      display: flex;
      flex-direction: column;
      width: 360px;
      gap: 12px;
      margin: auto;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .media-search-box {
      width: 100%;
      padding: 10px 16px;
      background-color: var(--primary-color);
      color: #000000;
      font-weight: bold;
      font-size: 16px;
      text-align: center;
      border: 1px solid var(--primary-hover);
      border-radius: 4px;
      box-sizing: border-box;
      box-shadow: 0 2px 5px rgba(0,0,0,0.15);
    }

    .login-card {
      width: 100%;
      background: var(--card-bg);
      padding: 24px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      box-sizing: border-box;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    .login-card h2 {
      margin-top: 0;
      margin-bottom: 20px;
      font-size: 20px;
      text-align: center;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      color: var(--text-muted);
    }

    .form-group input {
      width: 100%;
      padding: 10px;
      font-size: 14px;
      background-color: #1e1e1e;
      color: var(--text-color);
      border: 1px solid #444444;
      border-radius: 4px;
      box-sizing: border-box;
      outline: none;
    }

    .form-group input:focus {
      border-color: var(--primary-color);
    }

    .btn-action {
      width: 100%;
      padding: 10px 16px;
      background-color: var(--primary-color);
      color: #000000;
      font-weight: bold;
      font-size: 16px;
      border: 1px solid var(--primary-hover);
      border-radius: 4px;
      cursor: pointer;
      box-sizing: border-box;
    }

    .btn-action:hover {
      background-color: var(--primary-hover);
    }

    #errorMsg {
      color: var(--error-color);
      font-size: 13px;
      text-align: center;
      margin-top: 10px;
      display: none;
    }

    #landingContainer {
      display: none;
      width: 100vw;
      min-height: 100vh;
      background-color: var(--bg-color);
      box-sizing: border-box;
      padding: 20px;
      overflow-y: auto;
    }

    .landing-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 1200px;
      margin: 0 auto 20px auto;
    }

    .landing-banner {
      width: 220px;
    }

    .dashboard-content {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 24px;
      padding-bottom: 40px;
    }

    .category-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .section-title {
      font-size: 18px;
      font-weight: bold;
      color: var(--text-color);
      padding-left: 4px;
    }

    .row-container {
      display: flex;
      gap: 16px;
      overflow-x: auto;
      scroll-behavior: smooth;
      padding: 10px 4px;
      scrollbar-width: none;
    }

    .row-container::-webkit-scrollbar {
      display: none;
    }

    .media-card {
      flex: 0 0 160px;
      height: 240px;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 8px;
      box-sizing: border-box;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: transform 0.2s, border-color 0.2s;
    }

    .media-card:hover {
      transform: scale(1.03);
      border-color: var(--primary-color);
    }

    .media-poster-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    .media-service {
      font-size: 10px;
      color: var(--primary-color);
      font-weight: bold;
      text-transform: uppercase;
      background: rgba(0, 0, 0, 0.75);
      padding: 4px 6px;
      border-radius: 4px;
      align-self: flex-start;
      z-index: 2;
    }

    .media-title-banner {
      font-size: 12px;
      color: var(--text-color);
      font-weight: bold;
      background: rgba(0, 0, 0, 0.85);
      padding: 6px 8px;
      border-radius: 4px;
      text-align: center;
      z-index: 2;
      width: 100%;
      box-sizing: border-box;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <!-- Login View Component -->
  <div id="loginContainer">
    <div class="media-search-box">Media Search</div>
    <div class="login-card">
      <h2>Enter Credentials</h2>
      <form id="loginForm">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="user" autocomplete="username" autofocus required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="pass" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn-action">Login</button>
        <div id="errorMsg">Invalid username or password</div>
      </form>
    </div>
  </div>

  <!-- Landing View Component -->
  <div id="landingContainer">
    <div class="landing-header">
      <div class="media-search-box landing-banner">Media Search</div>
      <button class="btn-action" id="logoffBtn" style="width: auto; padding: 10px 20px; font-size: 14px;">Logoff</button>
    </div>

    <div class="dashboard-content" id="dashboardRows">
      <!-- Category rows will be dynamically injected here -->
    </div>
  </div>

  <script>
    const AUTH_CONFIG = {
      user: "tsilva",
      pass: "1234"
    };

    const userServices = [

      { username: "tsilva", service: "Disney", active: "Y" },
      { username: "tsilva", service: "HBO Max", active: "Y" },
      { username: "tsilva", service: "Amazon Prime", active: "Y" },
      { username: "tsilva", service: "Paramount+", active: "Y" },
      { username: "tsilva", service: "Crunchyroll", active: "Y" }
    ];

    const allMediaCatalog = [

      { service: "Netflix", title: "The Killer", releaseDate: "2023-11-10", posterUrl: "https://image.tmdb.org/t/p/w500/e7Jvsry47JJQruuezjU2X1Z6J77.jpg" },
      { service: "Netflix", title: "Glass Onion", releaseDate: "2022-12-23", posterUrl: "https://image.tmdb.org/t/p/w500/vD0uXYBBLLwRklEwTn8QhkFVKm9.jpg" },
      { service: "Netflix", title: "Beverly Hills Cop: Axel F", releaseDate: "2024-07-03", posterUrl: "https://image.tmdb.org/t/p/w500/zszXXypwkfcIZvTBXOVv4oO3mAC.jpg" },
      { service: "Netflix", title: "Spaceman", releaseDate: "2024-03-01", posterUrl: "https://image.tmdb.org/t/p/w500/zgQQF04u3OgPDJqClkgnyIRy79S.jpg" },
      { service: "Netflix", title: "Lift", releaseDate: "2024-01-12", posterUrl: "https://image.tmdb.org/t/p/w500/gma8o1jWa6m0K1iJ9TzHIiCyTt0.jpg" },
      
      { service: "Amazon Prime", title: "Road House", releaseDate: "2024-03-21", posterUrl: "https://image.tmdb.org/t/p/w500/bXi6IQiQDHD00JFio5ZSZOeRSBh.jpg" },
      { service: "Amazon Prime", title: "The Idea of You", releaseDate: "2024-05-02", posterUrl: "https://image.tmdb.org/t/p/w500/zLW69xMMPcxaCNzL98cQy5nK202.jpg" },
      { service: "Amazon Prime", title: "Red One", releaseDate: "2024-11-15", posterUrl: "https://image.tmdb.org/t/p/w500/cdqLnri3NEGcmfnqwk2TSIYtddg.jpg" },
      { service: "Amazon Prime", title: "Role Play", releaseDate: "2024-01-12", posterUrl: "https://image.tmdb.org/t/p/w500/7mriq9RJmcGbyC29kU0m9X9iO5u.jpg" },
      { service: "Amazon Prime", title: "The Tomorrow War", releaseDate: "2021-07-02", posterUrl: "https://image.tmdb.org/t/p/w500/34nDCQZwaEv84C4ij4MRGNCpCKm.jpg" },

      { service: "Hulu", title: "Quiz Lady", releaseDate: "2023-11-03", posterUrl: "https://image.tmdb.org/t/p/w500/z6hY9mXgQ6PqO15oD298L7N5w.jpg" },
      { service: "Hulu", title: "Prey", releaseDate: "2022-08-05", posterUrl: "https://image.tmdb.org/t/p/w500/ujr5pztc1dbe7ViFmCKcGgibpFG.jpg" },
      { service: "Hulu", title: "Not Okay", releaseDate: "2022-07-29", posterUrl: "https://image.tmdb.org/t/p/w500/xW1vtmV145kM2xP9x4q08R2Qp57.jpg" },
      { service: "Hulu", title: "Boston Strangler", releaseDate: "2023-03-17", posterUrl: "https://image.tmdb.org/t/p/w500/iLzYp8fBw0m0Zt2rP8V4J6N0M3u.jpg" },
      { service: "Hulu", title: "Flamin' Hot", releaseDate: "2023-06-09", posterUrl: "https://image.tmdb.org/t/p/w500/pEdbqVdKbeX2uT9R0H7gZp2K40.jpg" },

      { service: "Disney", title: "Inside Out 2", releaseDate: "2024-06-14", posterUrl: "https://image.tmdb.org/t/p/w500/vpnVM9B6NMmQpWeZvzLvDESb2QY.jpg" },
      { service: "Disney", title: "Deadpool & Wolverine", releaseDate: "2024-07-26", posterUrl: "https://image.tmdb.org/t/p/w500/8cdWjvZQUExUUTzyp4t6EDMubfO.jpg" },
      { service: "Disney", title: "Elemental", releaseDate: "2023-06-16", posterUrl: "https://image.tmdb.org/t/p/w500/4m1Au3YkjqsxF8iwQy0fPYSxE0h.jpg" },
      { service: "Disney", title: "Peter Pan & Wendy", releaseDate: "2023-04-28", posterUrl: "https://image.tmdb.org/t/p/w500/9NXw4nyLGOPjWlYF3C73lPHj1Qk.jpg" },
      { service: "Disney", title: "Disenchanted", releaseDate: "2022-11-18", posterUrl: "https://image.tmdb.org/t/p/w500/4xwAO9UGDuPSTwE0wUfL4j7l3l.jpg" },

      { service: "HBO Max", title: "The Batman", releaseDate: "2022-03-04", posterUrl: "https://image.tmdb.org/t/p/w500/74xTEgt7R36Fpooo50r9T25onhq.jpg" },
      { service: "HBO Max", title: "Dune: Part Two", releaseDate: "2024-03-01", posterUrl: "https://image.tmdb.org/t/p/w500/1pdfifyIWwrkHNp4X0tK9M9G0U5.jpg" },
      { service: "HBO Max", title: "Furiosa", releaseDate: "2024-05-24", posterUrl: "https://image.tmdb.org/t/p/w500/iADOJ8Zymht2JPMoy3R7xceZprc.jpg" },
      { service: "HBO Max", title: "The Flash", releaseDate: "2023-06-16", posterUrl: "https://image.tmdb.org/t/p/w500/rktDFPbfHfUbArZ6OOOKsXcv0Bm.jpg" },
      { service: "HBO Max", title: "Blue Beetle", releaseDate: "2023-08-18", posterUrl: "https://image.tmdb.org/t/p/w500/mXLOHHcIBuXU21yqGk0i9tMdf3t.jpg" },

      { service: "Paramount+", title: "Top Gun: Maverick", releaseDate: "2022-05-27", posterUrl: "https://image.tmdb.org/t/p/w500/62HCnUTziyWcpDaBO2i1DX17ljH.jpg" },
      { service: "Paramount+", title: "A Quiet Place: Day One", releaseDate: "2024-06-28", posterUrl: "https://image.tmdb.org/t/p/w500/yrpPYKijwdMHyTGIOd1iK1h0Xno.jpg" },
      { service: "Paramount+", title: "IF", releaseDate: "2024-05-17", posterUrl: "https://image.tmdb.org/t/p/w500/xbpktj9Yg9a6s904323l9p3M020.jpg" },
      { service: "Paramount+", title: "Mission: Impossible - Dead Reckoning", releaseDate: "2023-07-12", posterUrl: "https://image.tmdb.org/t/p/w500/NNxYkU70HPurnNCSiCjYAmacwm.jpg" },
      { service: "Paramount+", title: "Babylon", releaseDate: "2022-12-23", posterUrl: "https://image.tmdb.org/t/p/w500/wjOHjIC3UwJVrGIMh7rxj2c842b.jpg" },

      { service: "Crunchyroll", title: "Demon Slayer: To the Hashira Training", releaseDate: "2024-02-23", posterUrl: "https://image.tmdb.org/t/p/w500/xXpVYqQqjWWmC84l2c2d4wZ8hYn.jpg" },
      { service: "Crunchyroll", title: "SPY x FAMILY CODE: White", releaseDate: "2023-12-22", posterUrl: "https://image.tmdb.org/t/p/w500/aWv12K567R4TqR71d9P7rR552.jpg" },
      { service: "Crunchyroll", title: "HAIKYU!! The Dumpster Battle", releaseDate: "2024-02-16", posterUrl: "https://image.tmdb.org/t/p/w500/gLwXb75f8wO681e1p83792jYj7b.jpg" },
      { service: "Crunchyroll", title: "JUJUTSU KAISEN Hidden Inventory", releaseDate: "2023-07-06", posterUrl: "https://image.tmdb.org/t/p/w500/vQEjio0z1xWlU1qE9l5mPzK3J5.jpg" },
      { service: "Crunchyroll", title: "Chainsaw Man", releaseDate: "2022-10-12", posterUrl: "https://image.tmdb.org/t/p/w500/npdB6nDHzbJbxqUp6m5z9b1FfXo.jpg" }
    ];

    function getSearchUrl(item) {
      const year = item.releaseDate ? item.releaseDate.split('-')[0] : '';
      const query = `${item.title} ${year}`;
      return `https://www.google.com/search?q=${encodeURIComponent(query)}`;
    }

    function setViewState(isLoggedIn, username = "") {
      const loginContainer = document.getElementById('loginContainer');
      const landingContainer = document.getElementById('landingContainer');

      if (isLoggedIn) {
        if (loginContainer) loginContainer.style.display = 'none';
        if (landingContainer) landingContainer.style.display = 'block';
        renderDashboard(username);
      } else {
        if (landingContainer) landingContainer.style.display = 'none';
        if (loginContainer) loginContainer.style.display = 'flex';
      }
    }

    function renderDashboard(username) {
      const dashboard = document.getElementById('dashboardRows');
      if (!dashboard) return;
      dashboard.innerHTML = '';

      const activeServices = userServices
        .filter(s => s.username.toLowerCase() === username.toLowerCase() && s.active && s.active.toUpperCase() === 'Y')
        .map(s => s.service);

      const activeServiceItems = allMediaCatalog.filter(item => activeServices.includes(item.service));

      activeServiceItems.sort((a, b) => {
        const dateA = new Date(a.releaseDate);
        const dateB = new Date(b.releaseDate);
        if (dateB - dateA !== 0) {
          return dateB - dateA;
        }
        return a.title.localeCompare(b.title);
      });

      if (activeServiceItems.length > 0) {
        const section = document.createElement('div');
        section.className = 'category-section';

        const titleDiv = document.createElement('div');
        titleDiv.className = 'section-title';
        titleDiv.textContent = "Top New Arrivals";
        section.appendChild(titleDiv);

        const row = document.createElement('div');
        row.className = 'row-container';

        activeServiceItems.forEach(item => {
          const card = document.createElement('div');
          card.className = 'media-card';
          
          let imgHtml = '';
          if (item.posterUrl) {
            // Added onerror fallback to prevent black boxes if a poster fails to load
            imgHtml = `<img src="${item.posterUrl}" class="media-poster-img" alt="${item.title}" loading="lazy" onerror="this.onerror=null;this.src='https://images.unsplash.com/photo-1485846234645-a62644f84728?w=500&auto=format&fit=crop&q=60';">`;
          }

          card.innerHTML = `
            ${imgHtml}
            <span class="media-service">${item.service}</span>
            <span class="media-title-banner" title="${item.title}">${item.title}</span>
          `;
          card.addEventListener('click', () => {
            window.open(getSearchUrl(item), '_blank');
          });
          row.appendChild(card);
        });

        section.appendChild(row);
        dashboard.appendChild(section);
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const urlUser = urlParams.get('user');
      const urlPass = urlParams.get('pass');

      if (urlUser && urlUser.toLowerCase() === AUTH_CONFIG.user && urlPass === AUTH_CONFIG.pass) {
        sessionStorage.setItem('loggedInUser', AUTH_CONFIG.user);
      }

      const savedUser = sessionStorage.getItem('loggedInUser');
      setViewState(!!savedUser, savedUser || AUTH_CONFIG.user);
    });

    const loginForm = document.getElementById('loginForm');
    if (loginForm) {
      loginForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const u = document.getElementById('username').value.trim().toLowerCase();
        const p = document.getElementById('password').value.trim();
        const err = document.getElementById('errorMsg');

        if (u === AUTH_CONFIG.user && p === AUTH_CONFIG.pass) {
          sessionStorage.setItem('loggedInUser', u);
          document.getElementById('password').value = '';
          if (err) err.style.display = 'none';
          setViewState(true, u);
        } else {
          if (err) err.style.display = 'block';
        }
      });
    }

    const logoffBtn = document.getElementById('logoffBtn');
    if (logoffBtn) {
      logoffBtn.addEventListener('click', () => {
        sessionStorage.removeItem('loggedInUser');
        setViewState(false);
        const uField = document.getElementById('username');
        if (uField) {
          uField.value = '';
          uField.focus();
        }
      });
    }
  </script>
</body>
</html>
