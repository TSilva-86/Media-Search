<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Media Search</title>
  <style>
    :root {
      --bg-color: #000000;
      --card-bg: #121212;
      --card-hover: #181818;
      --primary-color: #28a745;
      --primary-hover: #218838;
      --text-color: #ffffff;
      --text-muted: #bbbbbb;
      --border-color: #333333;
      --error-color: #ff4d4d;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    /* Isolated Login Module */
    #loginContainer {
      display: flex;
      flex-direction: column;
      width: 360px;
      gap: 12px;
    }

    .media-search-box {
      width: 100%;
      padding: 10px 16px;
      background-color: var(--primary-color);
      color: #000000;
      font-weight: bold;
      font-size: 16px;
      text-align: center;
      border: 1px solid var(--primary-hover);
      border-radius: 4px;
      box-sizing: border-box;
      box-shadow: 0 2px 5px rgba(0,0,0,0.15);
    }

    .login-card {
      width: 100%;
      background: var(--card-bg);
      padding: 24px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      box-sizing: border-box;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    .login-card h2 {
      margin-top: 0;
      margin-bottom: 20px;
      font-size: 20px;
      text-align: center;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      color: var(--text-muted);
    }

    .form-group input {
      width: 100%;
      padding: 10px;
      font-size: 14px;
      background-color: #1e1e1e;
      color: var(--text-color);
      border: 1px solid #444444;
      border-radius: 4px;
      box-sizing: border-box;
      outline: none;
    }

    .form-group input:focus {
      border-color: var(--primary-color);
    }

    .btn-action {
      width: 100%;
      padding: 10px 16px;
      background-color: var(--primary-color);
      color: #000000;
      font-weight: bold;
      font-size: 16px;
      border: 1px solid var(--primary-hover);
      border-radius: 4px;
      cursor: pointer;
      box-sizing: border-box;
    }

    .btn-action:hover {
      background-color: var(--primary-hover);
    }

    #errorMsg {
      color: var(--error-color);
      font-size: 13px;
      text-align: center;
      margin-top: 10px;
      display: none;
    }

    /* Isolated Landing Module */
    #landingContainer {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: var(--bg-color);
      box-sizing: border-box;
      padding: 20px;
      overflow-y: auto;
    }

    .landing-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }

    .landing-banner {
      width: 220px;
    }

    .section-banner {
      width: 220px;
      margin-top: 25px;
      margin-bottom: 15px;
    }

    .carousel-wrapper {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      max-width: 1100px;
    }

    .carousel-btn {
      background-color: var(--card-bg);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      font-size: 20px;
      font-weight: bold;
      width: 44px;
      height: 110px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-shrink: 0;
    }

    .carousel-btn:hover {
      background-color: var(--primary-color);
      color: #000000;
      border-color: var(--primary-hover);
    }

    .scroll-container {
      display: flex;
      gap: 16px;
      overflow: hidden;
      width: 100%;
      padding: 5px 0;
    }

    .media-card {
      flex: 0 0 180px;
      height: 110px;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 12px;
      text-align: center;
      box-sizing: border-box;
      cursor: pointer;
      transition: border-color 0.2s, background-color 0.2s;
    }

    .media-card:hover {
      border-color: var(--primary-color);
      background-color: var(--card-hover);
    }

    .media-service {
      font-size: 11px;
      color: var(--primary-color);
      font-weight: bold;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .media-title {
      font-size: 13px;
      color: var(--text-color);
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- Login View Component -->
  <div id="loginContainer">
    <div class="media-search-box">Media Search</div>
    <div class="login-card">
      <h2>Enter Credentials</h2>
      <form id="loginForm">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="user" autocomplete="username" autofocus required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="pass" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn-action">Login</button>
        <div id="errorMsg">Invalid username or password</div>
      </form>
    </div>
  </div>

  <!-- Landing View Component -->
  <div id="landingContainer">
    <div class="landing-header">
      <div class="media-search-box landing-banner">Media Search</div>
      <button class="btn-action" id="logoffBtn" style="width: auto; padding: 10px 20px; font-size: 14px;">Logoff</button>
    </div>

    <div class="media-search-box section-banner">Top New Arrivals</div>
    
    <div class="carousel-wrapper">
      <button class="carousel-btn" id="prevBtn">&#10094;</button>
      <div class="scroll-container" id="carouselTrack"></div>
      <button class="carousel-btn" id="nextBtn">&#10095;</button>
    </div>
  </div>

  <script>
    /* ==========================================
       1. CONFIGURATION & DATA LAYER
       ========================================== */
    const AUTH_CONFIG = {
      user: "tsilva",
      pass: "1234"
    };

    const userServices = [
      { username: "tsilva", service: "Netflix", active: "Y" },
      { username: "tsilva", service: "Hulu", active: "Y" },
      { username: "tsilva", service: "Disney", active: "Y" },
      { username: "tsilva", service: "HBO Max", active: "Y" },
      { username: "tsilva", service: "Amazon Prime", active: "Y" },
      { username: "tsilva", service: "Paramount+", active: "Y" },
      { username: "tsilva", service: "Crunchyroll", active: "Y" }
    ];

    const allMediaCatalog = [
      { service: "Netflix", title: "Rebel Ridge", releaseDate: "2024-09-06" },
      { service: "Amazon Prime", title: "Road House", releaseDate: "2024-03-21" },
      { service: "Hulu", title: "Quiz Lady", releaseDate: "2023-11-03" },
      { service: "Netflix", title: "The Killer", releaseDate: "2023-11-10" },
      { service: "Amazon Prime", title: "The Idea of You", releaseDate: "2024-05-02" },
      { service: "Hulu", title: "Prey", releaseDate: "2022-08-05" },
      { service: "Disney", title: "Inside Out 2", releaseDate: "2024-06-14" },
      { service: "HBO Max", title: "The Batman", releaseDate: "2022-03-04" },
      { service: "Paramount+", title: "Top Gun: Maverick", releaseDate: "2022-05-27" },
      { service: "Crunchyroll", title: "Demon Slayer: To the Hashira Training", releaseDate: "2024-02-23" },
      { service: "Netflix", title: "Glass Onion", releaseDate: "2022-12-23" }
    ];

    /* ==========================================
       2. ISOLATED URL GENERATION LOGIC
       ========================================== */
    function getSearchUrl(service, title) {
      const q = encodeURIComponent(title);
      switch(service) {
        case "Netflix":
          return `https://www.netflix.com/search?q=${q}`;
        case "Amazon Prime":
          return `https://www.amazon.com/s?k=${q}&i=prime-video`;
        case "Hulu":
          return `https://www.hulu.com/search?q=${q}`;
        case "Disney":
          return `https://www.disneyplus.com/search?q=${q}`;
        case "HBO Max":
          return `https://www.max.com/search?q=${q}`;
        case "Paramount+":
          return `https://www.paramountplus.com/search/?q=${q}`;
        case "Crunchyroll":
          return `https://www.crunchyroll.com/search?q=${q}`;
        default:
          return `https://www.google.com/search?q=${q}+${encodeURIComponent(service)}`;
      }
    }

    /* ==========================================
       3. VIEW & SESSION CONTROLLER LAYER
       ========================================== */
    function setViewState(isLoggedIn, username = "") {
      const loginContainer = document.getElementById('loginContainer');
      const landingContainer = document.getElementById('landingContainer');

      if (isLoggedIn) {
        if (loginContainer) loginContainer.style.display = 'none';
        if (landingContainer) landingContainer.style.display = 'block';
        renderCarousel(username);
      } else {
        if (landingContainer) landingContainer.style.display = 'none';
        if (loginContainer) loginContainer.style.display = 'flex';
      }
    }

    function renderCarousel(username) {
      const track = document.getElementById('carouselTrack');
      if (!track) return;
      track.innerHTML = '';

      const activeServices = userServices
        .filter(s => s.username.toLowerCase() === username.toLowerCase() && s.active && s.active.toUpperCase() === 'Y')
        .map(s => s.service);

      const items = allMediaCatalog
        .filter(item => activeServices.includes(item.service))
        .sort((a, b) => new Date(b.releaseDate) - new Date(a.releaseDate));

      items.forEach(item => {
        const card = document.createElement('div');
        card.className = 'media-card';
        card.innerHTML = `
          <span class="media-service">${item.service}</span>
          <span class="media-title">${item.title}</span>
        `;
        card.addEventListener('click', () => {
          window.open(getSearchUrl(item.service, item.title), '_blank');
        });
        track.appendChild(card);
      });
    }

    /* ==========================================
       4. EVENT BINDINGS & INIT
       ========================================== */
    window.addEventListener('DOMContentLoaded', () => {
      const savedUser = sessionStorage.getItem('loggedInUser');
      setViewState(!!savedUser, savedUser);
    });

    const loginForm = document.getElementById('loginForm');
    if (loginForm) {
      loginForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const u = document.getElementById('username').value.trim().toLowerCase();
        const p = document.getElementById('password').value.trim();
        const err = document.getElementById('errorMsg');

        if (u === AUTH_CONFIG.user && p === AUTH_CONFIG.pass) {
          sessionStorage.setItem('loggedInUser', u);
          document.getElementById('password').value = '';
          if (err) err.style.display = 'none';
          setViewState(true, u);
        } else {
          if (err) err.style.display = 'block';
        }
      });
    }

    const logoffBtn = document.getElementById('logoffBtn');
    if (logoffBtn) {
      logoffBtn.addEventListener('click', () => {
        sessionStorage.removeItem('loggedInUser');
        setViewState(false);
        const uField = document.getElementById('username');
        if (uField) {
          uField.value = '';
          uField.focus();
        }
      });
    }

    const track = document.getElementById('carouselTrack');
    const nextBtn = document.getElementById('nextBtn');
    const prevBtn = document.getElementById('prevBtn');

    if (nextBtn && track) {
      nextBtn.addEventListener('click', () => {
        const first = track.firstElementChild;
        if (first) track.appendChild(first);
      });
    }

    if (prevBtn && track) {
      prevBtn.addEventListener('click', () => {
        const last = track.lastElementChild;
        if (last) track.insertBefore(last, track.firstElementChild);
      });
    }
  </script>
</body>
</html>
