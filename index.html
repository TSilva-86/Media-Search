<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Media Search - v.19</title>
<style>
:root {
--bg-color: #000000;
--card-bg: #121212;
--card-hover: #181818;
--primary-color: #28a745;
--primary-hover: #218838;
--text-color: #ffffff;
--text-muted: #bbbbbb;
--border-color: #333333;
--error-color: #ff4d4d;
}
body {
margin: 0;
padding: 0;
background-color: var(--bg-color);
color: var(--text-color);
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
display: flex;
flex-direction: column;
min-height: 100vh;
}
header {
background-color: var(--card-bg);
border-bottom: 1px solid var(--border-color);
padding: 20px;
text-align: center;
}
h1 {
margin: 0 0 5px 0;
font-size: 24px;
color: var(--text-color);
}
.version {
font-size: 12px;
color: var(--text-muted);
}
.container {
flex: 1;
max-width: 1200px;
margin: 0 auto;
padding: 20px;
width: 100%;
box-sizing: border-box;
}
.empty-state {
text-align: center;
padding: 50px 20px;
color: var(--text-muted);
font-size: 16px;
}
.category-section {
margin-bottom: 30px;
}
.section-header-wrapper {
display: flex;
align-items: center;
justify-content: space-between;
margin-bottom: 15px;
border-bottom: 2px solid var(--border-color);
padding-bottom: 8px;
}
.section-title {
font-size: 20px;
font-weight: bold;
color: var(--primary-color);
margin: 0;
}
.scroll-buttons {
display: flex;
gap: 8px;
}
.scroll-btn {
background: var(--card-bg);
color: var(--text-color);
border: 1px solid var(--border-color);
border-radius: 4px;
width: 32px;
height: 32px;
cursor: pointer;
display: flex;
align-items: center;
justify-content: center;
font-size: 16px;
transition: background 0.2s;
}
.scroll-btn:hover {
background: var(--card-hover);
border-color: var(--primary-color);
}
.carousel-container {
position: relative;
display: flex;
align-items: center;
}
.tiles-wrapper {
display: flex;
gap: 15px;
overflow-x: auto;
scroll-behavior: smooth;
padding-bottom: 10px;
scrollbar-width: thin;
scrollbar-color: var(--border-color) transparent;
width: 100%;
}
.tiles-wrapper::-webkit-scrollbar {
height: 6px;
}
.tiles-wrapper::-webkit-scrollbar-track {
background: transparent;
}
.tiles-wrapper::-webkit-scrollbar-thumb {
background-color: var(--border-color);
border-radius: 3px;
}
.media-card {
flex: 0 0 200px;
background: var(--card-bg);
border: 1px solid var(--border-color);
border-radius: 6px;
overflow: hidden;
display: flex;
flex-direction: column;
transition: transform 0.2s, border-color 0.2s;
text-decoration: none;
color: inherit;
}
.media-card:hover {
transform: translateY(-2px);
border-color: var(--primary-color);
}
.media-header {
padding: 8px 10px;
font-size: 12px;
font-weight: bold;
text-align: center;
white-space: nowrap;
overflow: hidden;
text-overflow: ellipsis;
color: #000;
}
.media-body {
padding: 12px 10px;
font-size: 14px;
font-weight: 500;
text-align: center;
color: var(--text-color);
min-height: 40px;
display: flex;
align-items: center;
justify-content: center;
}
</style>
</head>
<body>

<header>
    <h1>Media Search</h1>
    <div class="version">v.19</div>
</header>

<div id="app" class="container">
    <div class="empty-state">Loading live media data...</div>
</div>

<script>
    const availableServices = [
        { name: "Netflix", color: "#E50914" },
        { name: "Amazon Prime", color: "#00A8E1" },
        { name: "Disney+", color: "#113CCF" },
        { name: "HBO Max", color: "#9933FF" },
        { name: "Hulu", color: "#1CE783" },
        { name: "Crunchyroll", color: "#F47521" },
        { name: "Paramount+", color: "#0064FF" },
        { name: "Peacock", color: "#000000", textColor: "#FFFFFF" },
        { name: "Showtime", color: "#ED1C24" }
    ];

    let allMediaCatalog = [];

    function getSearchUrl(item) {
        const query = encodeURIComponent(item.service + " " + item.title);
        return `https://www.google.com/search?q=${query}`;
    }

    async function fetchLiveNewArrivals() {
        const appContainer = document.getElementById('app');
        try {
            const response = await fetch("https://api.allorigins.win/get?url=" + encodeURIComponent("https://rss.applemarketingtools.com/api/v2/us/movies/top-movies/100/movies.json"));
            if (!response.ok) throw new Error("Live data fetch failed");

            const wrapper = await response.json();
            const data = JSON.parse(wrapper.contents);
            const trendingItems = data.feed && data.feed.results ? data.feed.results : [];

            if (trendingItems.length === 0) {
                throw new Error("No live items found");
            }

            allMediaCatalog = [];
            availableServices.forEach((service, index) => {
                const sliceStart = index * 10;
                const serviceMovies = trendingItems.slice(sliceStart, sliceStart + 10);
                serviceMovies.forEach(movie => {
                    allMediaCatalog.push({
                        service: service.name,
                        title: movie.name || "Untitled"
                    });
                });
            });

            renderDashboard();
        } catch (error) {
            console.warn("Live fetch error:", error);
            appContainer.innerHTML = '<div class="empty-state">Unable to load live media data at this time. Please check back later.</div>';
        }
    }

    function scrollContainer(containerId, direction) {
        const container = document.getElementById(containerId);
        if (container) {
            const scrollAmount = 300;
            container.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
        }
    }

    function renderDashboard() {
        const appContainer = document.getElementById('app');
        appContainer.innerHTML = '';

        if (allMediaCatalog.length === 0) {
            appContainer.innerHTML = '<div class="empty-state">Unable to load live media data at this time. Please check back later.</div>';
            return;
        }

        availableServices.forEach((service, index) => {
            const serviceItems = allMediaCatalog.filter(item => item.service === service.name);
            if (serviceItems.length === 0) return;

            const section = document.createElement('div');
            section.className = 'category-section';

            const headerWrapper = document.createElement('div');
            headerWrapper.className = 'section-header-wrapper';

            const titleDiv = document.createElement('h2');
            titleDiv.className = 'section-title';
            titleDiv.textContent = "Top New Arrivals";
            headerWrapper.appendChild(titleDiv);

            const scrollButtons = document.createElement('div');
            scrollButtons.className = 'scroll-buttons';

            const leftBtn = document.createElement('button');
            leftBtn.className = 'scroll-btn';
            leftBtn.innerHTML = '&#10094;';
            leftBtn.title = 'Scroll Left';
            leftBtn.onclick = () => scrollContainer(`tiles-${index}`, -1);

            const rightBtn = document.createElement('button');
            rightBtn.className = 'scroll-btn';
            rightBtn.innerHTML = '&#10095;';
            rightBtn.title = 'Scroll Right';
            rightBtn.onclick = () => scrollContainer(`tiles-${index}`, 1);

            scrollButtons.appendChild(leftBtn);
            scrollButtons.appendChild(rightBtn);
            headerWrapper.appendChild(scrollButtons);
            section.appendChild(headerWrapper);

            const carouselContainer = document.createElement('div');
            carouselContainer.className = 'carousel-container';

            const tilesWrapper = document.createElement('div');
            tilesWrapper.className, tilesWrapper.id = 'tiles-' + index; // Wait, let's fix assignment
            tilesWrapper.className = 'tiles-wrapper';
            tilesWrapper.id = `tiles-${index}`;

            serviceItems.forEach(item => {
                const card = document.createElement('a');
                card.className = 'media-card';
                card.href = getSearchUrl(item);
                card.target = "_blank";

                const header = document.createElement('div');
                header.className = 'media-header';
                header.style.backgroundColor = service.color;
                header.style.color = service.textColor || '#000000';
                header.textContent = service.name;

                const body = document.createElement('div');
                body.className = 'media-body';
                body.textContent = item.title;

                card.appendChild(header);
                card.appendChild(body);
                tilesWrapper.appendChild(card);
            });

            carouselContainer.appendChild(tilesWrapper);
            section.appendChild(carouselContainer);
            appContainer.appendChild(section);
        });
    }

    fetchLiveNewArrivals();
</script>

</body>
</html>
