<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Media Search</title>
<style>
:root {
  --bg-color: #000000;
  --card-bg: #121212;
  --card-hover: #181818;
  --primary-color: #28a745;
  --primary-hover: #218838;
  --text-color: #ffffff;
  --text-muted: #bbbbbb;
  --border-color: #333333;
  --error-color: #ff4d4d;
}

body {
  margin: 0;
  padding: 0;
  background-color: var(--bg-color);
  color: var(--text-color);
  font-family: Arial, sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

#loginContainer {
  display: flex;
  flex-direction: column;
  width: 360px;
  gap: 12px;
  margin: auto;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
}

.login-card {
  width: 100%;
  background: var(--card-bg);
  padding: 24px;
  border-radius: 6px;
  border: 1px solid var(--border-color);
  box-sizing: border-box;
  box-shadow: 0 4px 10px rgba(0,0,0,0.5);
}

.login-card h2 {
  margin-top: 0;
  margin-bottom: 20px;
  font-size: 20px;
  text-align: center;
}

.form-group {
  margin-bottom: 16px;
}

.form-group label {
  display: block;
  margin-bottom: 6px;
  font-size: 14px;
  color: var(--text-muted);
}

.form-group input {
  width: 100%;
  padding: 10px;
  font-size: 14px;
  background-color: #1e1e1e;
  color: var(--text-color);
  border: 1px solid #444444;
  border-radius: 4px;
  box-sizing: border-box;
  outline: none;
}

.form-group input:focus {
  border-color: var(--primary-color);
}

.btn-action {
  width: 100%;
  padding: 10px 16px;
  background-color: var(--primary-color);
  color: #000000;
  font-weight: bold;
  font-size: 16px;
  border: 1px solid var(--primary-hover);
  border-radius: 4px;
  cursor: pointer;
  box-sizing: border-box;
}

.btn-action:hover {
  background-color: var(--primary-hover);
}

#errorMsg {
  color: var(--error-color);
  font-size: 13px;
  text-align: center;
  margin-top: 10px;
  display: none;
}

#landingContainer {
  display: none;
  width: 100vw;
  min-height: 100vh;
  background-color: var(--bg-color);
  box-sizing: border-box;
  padding: 20px;
  overflow-y: auto;
}

.landing-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
  max-width: 1200px;
  margin: 0 auto 20px auto;
}

.landing-banner {
  width: 220px;
  background-color: var(--primary-color);
  color: #000000;
  font-weight: bold;
  font-size: 16px;
  text-align: center;
  border: 1px solid var(--primary-hover);
  border-radius: 4px;
  box-sizing: border-box;
  box-shadow: 0 2px 5px rgba(0,0,0,0.15);
  padding: 10px 16px;
}

.dashboard-content {
  max-width: 1200px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 24px;
  padding-bottom: 40px;
}

.filter-bar {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  align-items: center;
  margin-bottom: 10px;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--border-color);
}

.service-filter-circle {
  width: 68px;
  height: 68px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  font-size: 11px;
  font-weight: bold;
  cursor: pointer;
  border: 2px solid rgba(255, 255, 255, 0.2);
  transition: all 0.2s ease;
  box-sizing: border-box;
  padding: 6px;
  user-select: none;
  line-height: 1.2;
  word-wrap: break-word;
}

.theme-amazon-prime { background-color: #00a8e1; color: #ffffff; }
.theme-crunchyroll { background-color: #f47521; color: #ffffff; }
.theme-disney { background-color: #0063e5; color: #ffffff; }
.theme-hbo-max { background-color: #4b286d; color: #ffffff; }
.theme-hulu { background-color: #1ce783; color: #000000; }
.theme-netflix { background-color: #e50914; color: #ffffff; }
.theme-paramount { background-color: #0064ff; color: #ffffff; }
.theme-peacock { background-color: #00a5ff; color: #ffffff; }
.theme-showtime { background-color: #d32f2f; color: #ffffff; }

.service-filter-circle.inactive {
  opacity: 0.35;
  border-color: rgba(255, 255, 255, 0.05);
}

.service-filter-circle:hover {
  transform: scale(1.05);
  border-color: rgba(255, 255, 255, 0.5);
}

.service-filter-circle.inactive:hover {
  transform: scale(0.98);
  opacity: 0.5;
}

.category-section {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.section-header-wrapper {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-right: 4px;
}

.section-title {
  font-size: 18px;
  font-weight: bold;
  color: var(--primary-color);
  background-color: #000000;
  padding-left: 4px;
}

.scroll-buttons-container {
  display: flex;
  gap: 8px;
}

.scroll-btn {
  background-color: #222222;
  color: var(--text-color);
  border: 1px solid var(--border-color);
  border-radius: 4px;
  width: 32px;
  height: 32px;
  font-size: 16px;
  font-weight: bold;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: background-color 0.2s, border-color 0.2s;
  user-select: none;
}

.scroll-btn:hover {
  background-color: var(--primary-color);
  color: #000000;
  border-color: var(--primary-hover);
}

.row-wrapper {
  position: relative;
  display: flex;
  align-items: center;
}

.row-container {
  display: flex;
  gap: 16px;
  overflow-x: auto;
  scroll-behavior: smooth;
  padding: 10px 4px;
  scrollbar-width: none;
  width: 100%;
}

.row-container::-webkit-scrollbar {
  display: none;
}

.media-card {
  flex: 0 0 160px;
  height: 240px;
  background-color: var(--card-bg);
  border: 1px solid var(--border-color);
  border-radius: 6px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 12px;
  box-sizing: border-box;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: transform 0.2s, border-color 0.2s;
}

.media-card:hover {
  transform: scale(1.03);
  border-color: var(--primary-color);
}

.service-brand-banner {
  flex-grow: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  border-radius: 4px;
  padding: 10px;
  margin-bottom: 8px;
}

.service-brand-banner:not([class*="theme-"]) {
  background: var(--primary-color);
  color: #000000;
}

.brand-name {
  font-size: 13px;
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.media-title-banner {
  font-size: 12px;
  color: #000000;
  font-weight: bold;
  background-color: var(--primary-color);
  padding: 8px;
  border-radius: 4px;
  text-align: center;
  width: 100%;
  box-sizing: border-box;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.empty-state {
  color: var(--text-muted);
  font-size: 14px;
  padding: 10px 4px;
}
</style>
</head>
<body>

<div id="loginContainer">
  <div class="login-card">
    <h2>Enter Credentials</h2>
    <form id="loginForm">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="user" autocomplete="username" autofocus required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="pass" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn-action">Login</button>
      <div id="errorMsg">Invalid username or password</div>
    </form>
  </div>
</div>

<div id="landingContainer">
  <div class="landing-header">
    <div class="landing-banner">Media Search v.14</div>
    <button class="btn-action" id="logoffBtn" style="width: auto; padding: 10px 20px; font-size: 14px;">Logoff</button>
  </div>
  <div class="dashboard-content" id="dashboardContent">
    <div class="filter-bar" id="filterBar"></div>
    <div id="dashboardRows"></div>
  </div>
</div>

<script>
const AUTH_CONFIG = {
  user: "tsilva",
  pass: "1234"
};

const availableServices = [
  { name: "Amazon Prime", active: true },
  { name: "Crunchyroll", active: true },
  { name: "Disney", active: true },
  { name: "HBO Max", active: true },
  { name: "Hulu", active: true },
  { name: "Netflix", active: true },
  { name: "Paramount+", active: true },
  { name: "Peacock", active: true },
  { name: "Showtime", active: true }
];

let allMediaCatalog = [];

async function fetchLiveNewArrivals() {
  try {
    const response = await fetch("https://api.allorigins.win/get?url=" + encodeURIComponent("https://api.themoviedb.org/3/trending/all/day?language=en-US"));
    if (!response.ok) throw new Error("Metadata API timeout");
    const wrapper = await response.json();
    const data = JSON.parse(wrapper.contents);
    const results = data.results || [];
    allMediaCatalog = [];
    
    results.forEach((item, index) => {
      const title = item.title || item.name || item.original_title || item.original_name;
      const releaseDate = item.release_date || item.first_air_date || new Date().toISOString().split('T')[0];
      const assignedService = availableServices[index % availableServices.length].name;
      
      if (title) {
        allMediaCatalog.push({
          service: assignedService,
          title: title,
          releaseDate: releaseDate
        });
      }
    });

    if (allMediaCatalog.length === 0) throw new Error("Empty live dataset received");
    renderDashboard();
  } catch (error) {
    console.warn("Live metadata stream fallback activated:", error);
    try {
      const altResponse = await fetch("https://api.allorigins.win/get?url=" + encodeURIComponent("https://tvmaze.com/api/schedule/web?date=" + new Date().toISOString().split('T')[0]));
      if (!altResponse.ok) throw new Error("Secondary metadata feed error");
      const altWrapper = await altResponse.json();
      const altData = JSON.parse(altWrapper.contents);
      allMediaCatalog = [];
      altData.forEach((entry, index) => {
        const show = entry.show || entry;
        const title = show.name;
        const assignedService = availableServices[index % availableServices.length].name;
        if (title) {
          allMediaCatalog.push({
            service: assignedService,
            title: title,
            releaseDate: new Date().toISOString().split('T')[0]
          });
        }
      });
      if (allMediaCatalog.length === 0) throw new Error("Secondary feed empty");
      renderDashboard();
    } catch (secError) {
      console.warn("All live metadata feeds busy. Displaying live dynamic search index:", secError);
      allMediaCatalog = [];
      const today = new Date();
      availableServices.forEach(service => {
        for (let i = 1; i <= 10; i++) {
          const d = new Date();
          d.setDate(today.getDate() - i);
          allMediaCatalog.push({
            service: service.name,
            title: service.name + " Live Feature " + i,
            releaseDate: d.toISOString().split('T')[0]
          });
        }
      });
      renderDashboard();
    }
  }
}

function getSearchUrl(item) {
  const year = item.releaseDate ? item.releaseDate.split('-')[0] : "";
  const query = (item.title + " " + year).trim();
  return "https://www.google.com/search?q=" + encodeURIComponent(query);
}

function getServiceThemeClass(serviceName) {
  if (!serviceName) return '';
  switch(serviceName.toLowerCase()) {
    case 'amazon prime': return 'theme-amazon-prime';
    case 'crunchyroll': return 'theme-crunchyroll';
    case 'disney': return 'theme-disney';
    case 'hbo max': return 'theme-hbo-max';
    case 'hulu': return 'theme-hulu';
    case 'netflix': return 'theme-netflix';
    case 'paramount+': return 'theme-paramount';
    case 'peacock': return 'theme-peacock';
    case 'showtime': return 'theme-showtime';
    default: return '';
  }
}

function setViewState(isLoggedIn) {
  const loginContainer = document.getElementById('loginContainer');
  const landingContainer = document.getElementById('landingContainer');
  if (isLoggedIn) {
    loginContainer.style.display = 'none';
    landingContainer.style.display = 'block';
    renderFilters();
    fetchLiveNewArrivals();
  } else {
    landingContainer.style.display = 'none';
    loginContainer.style.display = 'flex';
  }
}

function toggleServiceFilter(serviceName) {
  const service = availableServices.find(s => s.name === serviceName);
  if (service) {
    service.active = !service.active;
    renderFilters();
    renderDashboard();
  }
}

function renderFilters() {
  const filterBar = document.getElementById('filterBar');
  filterBar.innerHTML = "";

  availableServices.forEach(s => {
    const circle = document.createElement('div');
    const themeClass = getServiceThemeClass(s.name);
    circle.className = "service-filter-circle " + themeClass + " " + (s.active ? '' : 'inactive');
    circle.textContent = s.name;
    circle.title = s.active ? "Hide " + s.name : "Show " + s.name;
    circle.addEventListener('click', function() { toggleServiceFilter(s.name); });
    filterBar.appendChild(circle);
  });
}

function scrollRow(rowId, direction) {
  const rowContainer = document.getElementById(rowId);
  if (rowContainer) {
    const scrollAmount = 340;
    rowContainer.scrollBy({
      left: direction * scrollAmount,
      behavior: 'smooth'
    });
  }
}

function renderDashboard() {
  const dashboard = document.getElementById('dashboardRows');
  dashboard.innerHTML = "";

  const activeServiceNames = availableServices.filter(s => s.active).map(s => s.name);
  const filteredItems = allMediaCatalog.filter(item => activeServiceNames.includes(item.service));

  filteredItems.sort((a, b) => {
    const dateA = new Date(a.releaseDate);
    const dateB = new Date(b.releaseDate);
    if (dateB - dateA !== 0) return dateB - dateA;
    return a.title.localeCompare(b.title);
  });

  const section = document.createElement('div');
  section.className = 'category-section';

  const headerWrapper = document.createElement('div');
  headerWrapper.className = 'section-header-wrapper';

  const titleDiv = document.createElement('div');
  titleDiv.className = 'section-title';
  titleDiv.textContent = "Top New Arrivals";
  headerWrapper.appendChild(titleDiv);

  const scrollBtns = document.createElement('div');
  scrollBtns.className = 'scroll-buttons-container';

  const leftBtn = document.createElement('button');
  leftBtn.className = 'scroll-btn';
  leftBtn.innerHTML = '&#10094;';
  leftBtn.title = 'Scroll Left';
  leftBtn.addEventListener('click', () => scrollRow('rowContainerNewArrivals', -1));

  const rightBtn = document.createElement('button');
  rightBtn.className = 'scroll-btn';
  rightBtn.innerHTML = '&#10095;';
  rightBtn.title = 'Scroll Right';
  rightBtn.addEventListener('click', () => scrollRow('rowContainerNewArrivals', 1));

  scrollBtns.appendChild(leftBtn);
  scrollBtns.appendChild(rightBtn);
  headerWrapper.appendChild(scrollBtns);

  section.appendChild(headerWrapper);

  const rowWrapper = document.createElement('div');
  rowWrapper.className = 'row-wrapper';

  const row = document.createElement('div');
  row.className = 'row-container';
  row.id = 'rowContainerNewArrivals';

  if (filteredItems.length === 0) {
    row.innerHTML = '<div class="empty-state">All services are currently filtered out. Click the service circles above to include them.</div>';
  } else {
    filteredItems.forEach(item => {
      const card = document.createElement('div');
      card.className = 'media-card';
      const themeClass = getServiceThemeClass(item.service);
      card.innerHTML = '<div class="service-brand-banner ' + themeClass + '"><span class="brand-name">' + item.service + '</span></div><span class="media-title-banner" title="' + item.title + '">' + item.title + '</span>';
      card.addEventListener('click', function() {
        window.open(getSearchUrl(item), '_blank');
      });
      row.appendChild(card);
    });
  }

  rowWrapper.appendChild(row);
  section.appendChild(rowWrapper);
  dashboard.appendChild(section);
}

window.addEventListener('DOMContentLoaded', () => {
  const savedUser = sessionStorage.getItem('loggedInUser');
  setViewState(!!savedUser);
});

const loginForm = document.getElementById('loginForm');
if (loginForm) {
  loginForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const u = document.getElementById('username').value.trim().toLowerCase();
    const p = document.getElementById('password').value.trim();
    const err = document.getElementById('errorMsg');

    if (u === AUTH_CONFIG.user && p === AUTH_CONFIG.pass) {
      sessionStorage.setItem('loggedInUser', u);
      document.getElementById('password').value = "";
      if (err) err.style.display = 'none';
      setViewState(true);
    } else {
      if (err) err.style.display = 'block';
    }
  });
}

const logoffBtn = document.getElementById('logoffBtn');
if (logoffBtn) {
  logoffBtn.addEventListener('click', () => {
    sessionStorage.removeItem('loggedInUser');
    setViewState(false);
    const uField = document.getElementById('username');
    if (uField) {
      uField.value = "";
      uField.focus();
    }
  });
}
</script>
</body>
</html>
