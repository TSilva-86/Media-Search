<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Search - V.3</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent-color: #38bdf8;
            --accent-hover: #0ea5e9;
            --error-color: #f43f5e;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Login Overlay */
        #login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(15, 23, 42, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .login-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 2.5rem;
            border-radius: 1rem;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.5);
        }

        .login-card h2 {
            margin-bottom: 1.5rem;
            font-size: 1.5rem;
            color: var(--text-color);
            text-align: center;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            font-size: 0.875rem;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem 1rem;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            color: var(--text-color);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            border-color: var(--accent-color);
        }

        .login-btn {
            width: 100%;
            padding: 0.75rem;
            background-color: var(--accent-color);
            color: #0f172a;
            border: none;
            border-radius: 0.5rem;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 0.5rem;
        }

        .login-btn:hover {
            background-color: var(--accent-hover);
        }

        #login-error {
            color: var(--error-color);
            font-size: 0.875rem;
            text-align: center;
            margin-top: 1rem;
            min-height: 1.25rem;
        }

        /* App Content (Hidden until authenticated) */
        #app-content {
            display: none;
            flex: 1;
            flex-direction: column;
        }

        header {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 1.25rem;
            color: var(--accent-color);
        }

        .logout-btn {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 0.5rem 1rem;
            border-radius: 0.375rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .logout-btn:hover {
            border-color: var(--error-color);
            color: var(--error-color);
        }

        /* Filter Sub-bar - multi-row responsive flex container */
        .filter-bar {
            background-color: rgba(30, 41, 59, 0.7);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: center;
            justify-content: center;
        }

        /* Perfect circular buttons with distinct borders, shadows, and clear typography */
        .platform-btn {
            width: 72px;
            height: 72px;
            aspect-ratio: 1 / 1;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 0.7rem;
            font-weight: 700;
            cursor: pointer;
            user-select: none;
            transition: transform 0.15s ease, filter 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
            padding: 6px;
            word-break: break-word;
            line-height: 1.15;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.4), inset 0 1px 2px rgba(255, 255, 255, 0.2);
        }

        .platform-btn:hover {
            transform: scale(1.08);
            border-color: rgba(255, 255, 255, 0.6);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.5), inset 0 1px 3px rgba(255, 255, 255, 0.3);
        }

        /* Excluded State: slightly darker, visually depressed with inner shadow */
        .platform-btn.excluded {
            filter: brightness(0.55) saturate(0.6);
            border-color: rgba(255, 255, 255, 0.1);
            box-shadow: inset 0 4px 6px rgba(0, 0, 0, 0.7), 0 1px 2px rgba(255, 255, 255, 0.05);
            transform: translateY(2px);
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            text-align: center;
        }

        .welcome-box h2 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .welcome-box p {
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <!-- Login Overlay -->
    <div id="login-overlay">
        <div class="login-card">
            <h2>Media Search</h2>
            <form id="login-form" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required autocomplete="current-password">
                </div>
                <button type="submit" class="login-btn">Sign In</button>
                <div id="login-error"></div>
            </form>
        </div>
    </div>

    <!-- Main Application Content -->
    <div id="app-content">
        <header>
            <h1>Media Search (V.3)</h1>
            <button class="logout-btn" onclick="handleLogout()">Sign Out</button>
        </header>

        <!-- Alphabetical Streaming Platform Filter Bar (Multi-row stackable, perfect circles) -->
        <div class="filter-bar" id="platform-filter-bar">
            <button class="platform-btn" data-service="Crunchyroll" style="background-color: #f47521; color: #ffffff;" title="Crunchyroll">Crunchyroll</button>
            <button class="platform-btn" data-service="Disney" style="background-color: #113ccf; color: #ffffff;" title="Disney">Disney</button>
            <button class="platform-btn" data-service="HBO Max" style="background-color: #5822b4; color: #ffffff;" title="HBO Max">HBO Max</button>
            <button class="platform-btn" data-service="Hulu" style="background-color: #1ce783; color: #000000; border-color: rgba(0,0,0,0.3);" title="Hulu">Hulu</button>
            <button class="platform-btn" data-service="Netflix" style="background-color: #e50914; color: #ffffff;" title="Netflix">Netflix</button>
            <button class="platform-btn" data-service="Paramount+" style="background-color: #0064ff; color: #ffffff;" title="Paramount+">Paramount+</button>
            <button class="platform-btn" data-service="Peacock" style="background-color: #050505; color: #0085ff; border-color: #0085ff;" title="Peacock">Peacock</button>
            <button class="platform-btn" data-service="Showtime" style="background-color: #df2227; color: #ffffff;" title="Showtime">Showtime</button>
        </div>

        <main>
            <div class="welcome-box">
                <h2>Welcome, Travis</h2>
                <p>Authentication successful. Perfect circle filters active with multi-row stacking.</p>
            </div>
        </main>
    </div>

    <script>
        // State management for platform toggles
        const SERVICES = ['Crunchyroll', 'Disney', 'HBO Max', 'Hulu', 'Netflix', 'Paramount+', 'Peacock', 'Showtime'];

        window.addEventListener('DOMContentLoaded', () => {
            const isAuthenticated = sessionStorage.getItem('media_search_auth');
            if (isAuthenticated === 'true') {
                showApp();
            }
            initFilters();
        });

        function handleLogin(event) {
            event.preventDefault();
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value;
            const errorDiv = document.getElementById('login-error');

            if (user === 'tsilva' && pass === '1234') {
                sessionStorage.setItem('media_search_auth', 'true');
                errorDiv.textContent = '';
                showApp();
            } else {
                errorDiv.textContent = 'Invalid username or password.';
            }
        }

        function showApp() {
            document.getElementById('login-overlay').style.display = 'none';
            document.getElementById('app-content').style.display = 'flex';
        }

        function handleLogout() {
            sessionStorage.removeItem('media_search_auth');
            sessionStorage.removeItem('media_search_excluded_platforms');
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
            document.getElementById('login-error').textContent = '';
            document.getElementById('app-content').style.display = 'none';
            document.getElementById('login-overlay').style.display = 'flex';
            initFilters();
        }

        // Filter Logic
        function getExcludedPlatforms() {
            try {
                const stored = sessionStorage.getItem('media_search_excluded_platforms');
                return stored ? JSON.parse(stored) : [];
            } catch (e) {
                return [];
            }
        }

        function setExcludedPlatforms(excluded) {
            sessionStorage.setItem('media_search_excluded_platforms', JSON.stringify(excluded));
        }

        function initFilters() {
            const excluded = getExcludedPlatforms();
            const buttons = document.querySelectorAll('.platform-btn');

            buttons.forEach(btn => {
                const service = btn.getAttribute('data-service');
                if (excluded.includes(service)) {
                    btn.classList.add('excluded');
                } else {
                    btn.classList.remove('excluded');
                }

                btn.onclick = () => toggleService(service);
                btn.ondblclick = (e) => {
                    e.preventDefault();
                    isolateService(service);
                };

                let pressTimer;
                btn.onmousedown = (e) => {
                    if (e.detail === 2) return;
                    pressTimer = setTimeout(() => isolateService(service), 600);
                };
                btn.onmouseup = () => clearTimeout(pressTimer);
                btn.onmouseleave = () => clearTimeout(pressTimer);
                
                btn.ontouchstart = () => {
                    pressTimer = setTimeout(() => isolateService(service), 600);
                };
                btn.ontouchend = () => clearTimeout(pressTimer);
            });
        }

        function toggleService(serviceName) {
            let excluded = getExcludedPlatforms();
            if (excluded.includes(serviceName)) {
                excluded = excluded.filter(s => s !== serviceName);
            } else {
                excluded.push(serviceName);
            }
            setExcludedPlatforms(excluded);
            initFilters();
            triggerGlobalFilterEvent(excluded);
        }

        function isolateService(serviceName) {
            const excluded = SERVICES.filter(s => s !== serviceName);
            setExcludedPlatforms(excluded);
            initFilters();
            triggerGlobalFilterEvent(excluded);
        }

        function triggerGlobalFilterEvent(excludedList) {
            const event = new CustomEvent('mediaFilterChange', { detail: { excluded: excludedList } });
            window.dispatchEvent(event);
        }
    </script>
</body>
</html>
