<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Media Search</title>
<style>
:root {
  --bg-color: #000000;
  --card-bg: #121212;
  --card-hover: #181818;
  --primary-color: #28a745;
  --primary-hover: #218838;
  --text-color: #ffffff;
  --text-muted: #bbbbbb;
  --border-color: #333333;
  --error-color: #ff4d4d;
}

body {
  margin: 0;
  padding: 0;
  background-color: var(--bg-color);
  color: var(--text-color);
  font-family: Arial, sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

#loginContainer {
  display: flex;
  flex-direction: column;
  width: 360px;
  gap: 12px;
  margin: auto;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
}

.login-card {
  width: 100%;
  background: var(--card-bg);
  padding: 24px;
  border-radius: 6px;
  border: 1px solid var(--border-color);
  box-sizing: border-box;
  box-shadow: 0 4px 10px rgba(0,0,0,0.5);
}

.login-card h2 {
  margin-top: 0;
  margin-bottom: 20px;
  font-size: 20px;
  text-align: center;
}

.form-group {
  margin-bottom: 16px;
}

.form-group label {
  display: block;
  margin-bottom: 6px;
  font-size: 14px;
  color: var(--text-muted);
}

.form-group input {
  width: 100%;
  padding: 10px;
  font-size: 14px;
  background-color: #1e1e1e;
  color: var(--text-color);
  border: 1px solid #444444;
  border-radius: 4px;
  box-sizing: border-box;
  outline: none;
}

.form-group input:focus {
  border-color: var(--primary-color);
}

.btn-action {
  width: 100%;
  padding: 10px 16px;
  background-color: var(--primary-color);
  color: #000000;
  font-weight: bold;
  font-size: 16px;
  border: 1px solid var(--primary-hover);
  border-radius: 4px;
  cursor: pointer;
  box-sizing: border-box;
}

.btn-action:hover {
  background-color: var(--primary-hover);
}

#errorMsg {
  color: var(--error-color);
  font-size: 13px;
  text-align: center;
  margin-top: 10px;
  display: none;
}

#landingContainer {
  display: none;
  width: 100vw;
  min-height: 100vh;
  background-color: var(--bg-color);
  box-sizing: border-box;
  padding: 20px;
  overflow-y: auto;
}

.landing-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
  max-width: 1200px;
  margin: 0 auto 20px auto;
}

.landing-banner {
  width: 220px;
  background-color: var(--primary-color);
  color: #000000;
  font-weight: bold;
  font-size: 16px;
  text-align: center;
  border: 1px solid var(--primary-hover);
  border-radius: 4px;
  box-sizing: border-box;
  box-shadow: 0 2px 5px rgba(0,0,0,0.15);
  padding: 10px 16px;
}

.dashboard-content {
  max-width: 1200px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 24px;
  padding-bottom: 40px;
}

.filter-bar {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  align-items: center;
  margin-bottom: 10px;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--border-color);
}

.service-filter-circle {
  width: 65px;
  height: 65px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  cursor: pointer;
  border: 2px solid rgba(255, 255, 255, 0.15);
  transition: all 0.2s ease;
  box-sizing: border-box;
  user-select: none;
  color: transparent !important;
  background-repeat: no-repeat;
  background-position: center center;
  background-size: 65% auto;
  opacity: 1;
}

.service-filter-circle.inactive {
  opacity: 0.45 !important;
}

/* Precise Icon Implementations 1x Centered */
.service-filter-circle.theme-netflix {
  background-color: #000000 !important;
  background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="%23000" /><path d="M32 15h14v46L32 15zm22 0h14v70H54V15z" fill="%23b9090b"/><path d="M46 61h1v24H32V61l14-46zm8-46h1v46L68 85H54V15z" fill="%23e50914"/></svg>') !important;
  background-size: 100% 100%;
}

.service-filter-circle.theme-amazon-prime {
  background-color: #151d24 !important;
  background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="%23151d24"/><path d="M20 40c10-5 25-7 40-3 12 3 20 9 20 9s-8-7-22-10c-15-3-30-1-38 4zm52 14c-1 3-4 6-8 5s-14-11-14-11 11 3 17 2 5-3 5-3z" fill="%2300a8e1"/></svg>') !important;
  background-size: 80% auto;
}

.service-filter-circle.theme-hulu {
  background-color: #0b0c0e !important;
  background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="%230b0c0e"/><path d="M25 35h10v12h10V35h10v30H45V55H35v10H25V35zm43 0h10v20c0 4-2 6-6 6h-4V51h3V35zm-15 0h10v30H53V35z" fill="%231ce783"/></svg>') !important;
  background-size: 75% auto;
}

.service-filter-circle.theme-disney {
  background-color: #020722 !important;
  background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="%23020722"/><path d="M20 50c30-15 50 0 60 10M30 40c10-2 20 5 25 15" stroke="%23fff" fill="none" stroke-width="3"/><path d="M40 35c5 10 15 20 30 20" stroke="%230063e5" fill="none" stroke-width="2"/></svg>') !important;
  background-size: 80% auto;
}

.service-filter-circle.theme-hbo-max {
  background-color: #02001c !important;
  background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="%2302001c"/><text x="50" y="60" font-size="28" font-family="Arial" font-weight="900" fill="%2300a5ff" text-anchor="middle">max</text></svg>') !important;
  background-size: 100% 100%;
}

.service-filter-circle.theme-crunchyroll {
  background-color: #141619 !important;
  background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="%23141619"/><circle cx="50" cy="50" r="25" fill="%23f47521"/><circle cx="58" cy="50" r="16" fill="%23141619"/><circle cx="56" cy="50" r="8" fill="%23f47521"/></svg>') !important;
  background-size: 85% auto;
}

.service-filter-circle.theme-paramount {
  background-color: #002244 !important;
  background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="%23002244"/><path d="M50 25 L25 65 L75 65 Z" fill="none" stroke="%23fff" stroke-width="4"/><circle cx="50" cy="50" r="30" fill="none" stroke="%23fff" stroke-width="2" stroke-dasharray="4 4"/></svg>') !important;
  background-size: 80% auto;
}

.service-filter-circle.theme-peacock {
  background-color: #000000 !important;
  background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="%23000"/><circle cx="35" cy="50" r="8" fill="%23ffc000"/><circle cx="45" cy="42" r="8" fill="%23ff6000"/><circle cx="55" cy="42" r="8" fill="%2300a0e0"/><circle cx="65" cy="50" r="8" fill="%23002060"/></svg>') !important;
  background-size: 80% auto;
}

.service-filter-circle.theme-showtime {
  background-color: #000000 !important;
  background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="%23d32f2f"/><text x="50" y="58" font-size="16" font-family="Arial" font-weight="900" fill="%23fff" text-anchor="middle" letter-spacing="1">SHO</text></svg>') !important;
  background-size: 100% 100%;
}

.service-filter-circle:hover {
  transform: scale(1.05);
  border-color: rgba(255, 255, 255, 0.4);
}

.service-filter-circle.inactive:hover {
  transform: scale(0.98);
}

.category-section {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.section-title {
  font-size: 18px;
  font-weight: bold;
  color: var(--text-color);
  padding-left: 4px;
}

.row-container {
  display: flex;
  gap: 16px;
  overflow-x: auto;
  scroll-behavior: smooth;
  padding: 10px 4px;
  scrollbar-width: none;
}

.row-container::-webkit-scrollbar {
  display: none;
}

.media-card {
  flex: 0 0 160px;
  height: 240px;
  background-color: var(--card-bg);
  border: 1px solid var(--border-color);
  border-radius: 6px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 12px;
  box-sizing: border-box;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: transform 0.2s, border-color 0.2s;
}

.media-card:hover {
  transform: scale(1.03);
  border-color: var(--primary-color);
}

.service-brand-banner {
  flex-grow: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  border-radius: 4px;
  padding: 10px;
  margin-bottom: 8px;
}

.service-brand-banner:not([class*="theme-"]) {
  background: var(--primary-color);
  color: #000000;
}

.brand-name {
  font-size: 13px;
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.brand-type {
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-top: 4px;
  opacity: 0.85;
}

.theme-amazon-prime { background: linear-gradient(135deg, #00a8e1, #146eb4); color: #ffffff; }
.theme-crunchyroll { background: linear-gradient(135deg, #f47521, #d64000); color: #ffffff; }
.theme-disney { background: linear-gradient(135deg, #1136b8, #0063e5); color: #ffffff; }
.theme-hbo-max { background: linear-gradient(135deg, #4b286d, #833ab4); color: #ffffff; }
.theme-hulu { background: linear-gradient(135deg, #1ce783, #107c41); color: #000000; }
.theme-netflix { background: linear-gradient(135deg, #b9090b, #e50914); color: #ffffff; }
.theme-paramount { background: linear-gradient(135deg, #0064ff, #001f5c); color: #ffffff; }
.theme-peacock { background: linear-gradient(135deg, #00a5ff, #002d72); color: #ffffff; }
.theme-showtime { background: linear-gradient(135deg, #d32f2f, #333333); color: #ffffff; }

.media-title-banner {
  font-size: 12px;
  color: #000000;
  font-weight: bold;
  background-color: var(--primary-color);
  padding: 8px;
  border-radius: 4px;
  text-align: center;
  width: 100%;
  box-sizing: border-box;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.empty-state {
  color: var(--text-muted);
  font-size: 14px;
  padding: 10px 4px;
}
</style>
</head>
<body>

<div id="loginContainer">
  <div class="login-card">
    <h2>Enter Credentials</h2>
    <form id="loginForm">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="user" autocomplete="username" autofocus required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="pass" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn-action">Login</button>
      <div id="errorMsg">Invalid username or password</div>
    </form>
  </div>
</div>

<div id="landingContainer">
  <div class="landing-header">
    <div class="landing-banner">Media Search</div>
    <button class="btn-action" id="logoffBtn" style="width: auto; padding: 10px 20px; font-size: 14px;">Logoff</button>
  </div>
  <div class="dashboard-content" id="dashboardContent">
    <div class="filter-bar" id="filterBar"></div>
    <div id="dashboardRows"></div>
  </div>
</div>

<script>
const AUTH_CONFIG = {
  user: "tsilva",
  pass: "1234"
};

const availableServices = [
  { name: "Amazon Prime", active: true },
  { name: "Crunchyroll", active: true },
  { name: "Disney", active: true },
  { name: "HBO Max", active: true },
  { name: "Hulu", active: true },
  { name: "Netflix", active: true },
  { name: "Paramount+", active: true },
  { name: "Peacock", active: true },
  { name: "Showtime", active: true }
];

const allMediaCatalog = [
  { service: "Netflix", title: "Rebel Ridge", releaseDate: "2024-09-06" },
  { service: "Netflix", title: "The Killer", releaseDate: "2023-11-10" },
  { service: "Amazon Prime", title: "Road House", releaseDate: "2024-03-21" },
  { service: "Hulu", title: "Quiz Lady", releaseDate: "2023-11-03" },
  { service: "Disney", title: "Inside Out 2", releaseDate: "2024-06-14" },
  { service: "HBO Max", title: "The Batman", releaseDate: "2022-03-04" },
  { service: "Paramount+", title: "Top Gun: Maverick", releaseDate: "2022-05-27" },
  { service: "Crunchyroll", title: "Demon Slayer: Hashira Training", releaseDate: "2024-02-23" },
  { service: "Peacock", title: "The Traitors", releaseDate: "2024-01-12" },
  { service: "Showtime", title: "The Curse", releaseDate: "2023-11-12" }
];

function getSearchUrl(item) {
  const year = item.releaseDate ? item.releaseDate.split('-') : "";
  const query = `${item.title} ${year}`.trim();
  return `https://www.google.com/search?q=${encodeURIComponent(query)}`;
}

function getServiceThemeClass(serviceName) {
  if (!serviceName) return '';
  switch(serviceName.toLowerCase()) {
    case 'amazon prime': return 'theme-amazon-prime';
    case 'crunchyroll': return 'theme-crunchyroll';
    case 'disney': return 'theme-disney';
    case 'hbo max': return 'theme-hbo-max';
    case 'hulu': return 'theme-hulu';
    case 'netflix': return 'theme-netflix';
    case 'paramount+': return 'theme-paramount';
    case 'peacock': return 'theme-peacock';
    case 'showtime': return 'theme-showtime';
    default: return '';
  }
}

function setViewState(isLoggedIn) {
  const loginContainer = document.getElementById('loginContainer');
  const landingContainer = document.getElementById('landingContainer');
  if (isLoggedIn) {
    loginContainer.style.display = 'none';
    landingContainer.style.display = 'block';
    renderFilters();
    renderDashboard();
  } else {
    landingContainer.style.display = 'none';
    loginContainer.style.display = 'flex';
  }
}

function toggleServiceFilter(serviceName) {
  const service = availableServices.find(s => s.name === serviceName);
  if (service) {
    service.active = !service.active;
    renderFilters();
    renderDashboard();
  }
}

function renderFilters() {
  const filterBar = document.getElementById('filterBar');
  filterBar.innerHTML = "";

  availableServices.forEach(s => {
    const circle = document.createElement('div');
    const themeClass = getServiceThemeClass(s.name);
    circle.className = `service-filter-circle ${themeClass} ${s.active ? '' : 'inactive'}`;
    circle.textContent = s.name;
    circle.title = s.active ? `Hide ${s.name}` : `Show ${s.name}`;
    circle.addEventListener('click', () => toggleServiceFilter(s.name));
    filterBar.appendChild(circle);
  });
}

function renderDashboard() {
  const dashboard = document.getElementById('dashboardRows');
  dashboard.innerHTML = "";

  const activeServiceNames = availableServices.filter(s => s.active).map(s => s.name);
  const filteredItems = allMediaCatalog.filter(item => activeServiceNames.includes(item.service));

  filteredItems.sort((a, b) => {
    const dateA = new Date(a.releaseDate);
    const dateB = new Date(b.releaseDate);
    if (dateB - dateA !== 0) return dateB - dateA;
    return a.title.localeCompare(b.title);
  });

  const section = document.createElement('div');
  section.className = 'category-section';

  const titleDiv = document.createElement('div');
  titleDiv.className = 'section-title';
  titleDiv.textContent = "Top New Arrivals";
  section.appendChild(titleDiv);

  const row = document.createElement('div');
  row.className = 'row-container';

  if (filteredItems.length === 0) {
    row.innerHTML = '<div class="empty-state">All services are currently filtered out. Click the service circles above to include them.<\/div>';
  } else {
    filteredItems.forEach(item => {
      const card = document.createElement('div');
      card.className = 'media-card';
      const themeClass = getServiceThemeClass(item.service);
      card.innerHTML = `
        <div class="service-brand-banner ${themeClass}">
          <span class="brand-name">${item.service}<\/span>
          <span class="brand-type">New Arrival<\/span>
        </div>
        <span class="media-title-banner" title="${item.title}">${item.title}<\/span>
      `;
      card.addEventListener('click', () => {
        window.open(getSearchUrl(item), '_blank');
      });
      row.appendChild(card);
    });
  }

  section.appendChild(row);
  dashboard.appendChild(section);
}

window.addEventListener('DOMContentLoaded', () => {
  const savedUser = sessionStorage.getItem('loggedInUser');
  setViewState(!!savedUser);
});

const loginForm = document.getElementById('loginForm');
if (loginForm) {
  loginForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const u = document.getElementById('username').value.trim().toLowerCase();
    const p = document.getElementById('password').value.trim();
    const err = document.getElementById('errorMsg');

    if (u === AUTH_CONFIG.user && p === AUTH_CONFIG.pass) {
      sessionStorage.setItem('loggedInUser', u);
      document.getElementById('password').value = "";
      if (err) err.style.display = 'none';
      setViewState(true);
    } else {
      if (err) err.style.display = 'block';
    }
  });
}

const logoffBtn = document.getElementById('logoffBtn');
if (logoffBtn) {
  logoffBtn.addEventListener('click', () => {
    sessionStorage.removeItem('loggedInUser');
    setViewState(false);
    const uField = document.getElementById('username');
    if (uField) {
      uField.value = "";
      uField.focus();
    }
  });
}
</script>
</body>
</html>
