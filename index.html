<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Media Search</title>
  <style>
    :root {
      --bg-color: #000000;
      --card-bg: #121212;
      --card-hover: #181818;
      --primary-color: #28a745;
      --primary-hover: #218838;
      --text-color: #ffffff;
      --text-muted: #bbbbbb;
      --border-color: #333333;
      --error-color: #ff4d4d;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: Arial, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    #loginContainer {
      display: flex;
      flex-direction: column;
      width: 360px;
      gap: 12px;
      margin: auto;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .media-search-box {
      width: 100%;
      padding: 10px 16px;
      background-color: var(--primary-color);
      color: #000000;
      font-weight: bold;
      font-size: 16px;
      text-align: center;
      border: 1px solid var(--primary-hover);
      border-radius: 4px;
      box-sizing: border-box;
      box-shadow: 0 2px 5px rgba(0,0,0,0.15);
    }

    .login-card {
      width: 100%;
      background: var(--card-bg);
      padding: 24px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      box-sizing: border-box;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    .login-card h2 {
      margin-top: 0;
      margin-bottom: 20px;
      font-size: 20px;
      text-align: center;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      color: var(--text-muted);
    }

    .form-group input {
      width: 100%;
      padding: 10px;
      font-size: 14px;
      background-color: #1e1e1e;
      color: var(--text-color);
      border: 1px solid #444444;
      border-radius: 4px;
      box-sizing: border-box;
      outline: none;
    }

    .form-group input:focus {
      border-color: var(--primary-color);
    }

    .btn-action {
      width: 100%;
      padding: 10px 16px;
      background-color: var(--primary-color);
      color: #000000;
      font-weight: bold;
      font-size: 16px;
      border: 1px solid var(--primary-hover);
      border-radius: 4px;
      cursor: pointer;
      box-sizing: border-box;
    }

    .btn-action:hover {
      background-color: var(--primary-hover);
    }

    #errorMsg {
      color: var(--error-color);
      font-size: 13px;
      text-align: center;
      margin-top: 10px;
      display: none;
    }

    #landingContainer {
      display: none;
      width: 100vw;
      min-height: 100vh;
      background-color: var(--bg-color);
      box-sizing: border-box;
      padding: 20px;
      overflow-y: auto;
    }

    .landing-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 1200px;
      margin: 0 auto 20px auto;
    }

    .landing-banner {
      width: 220px;
    }

    .dashboard-content {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 24px;
      padding-bottom: 40px;
    }

    .category-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .section-title {
      font-size: 18px;
      font-weight: bold;
      color: var(--text-color);
      padding-left: 4px;
    }

    .row-container {
      display: flex;
      gap: 16px;
      overflow-x: auto;
      scroll-behavior: smooth;
      padding: 10px 4px;
      scrollbar-width: none;
    }

    .row-container::-webkit-scrollbar {
      display: none;
    }

    .media-card {
      flex: 0 0 160px;
      height: 240px;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 10px;
      box-sizing: border-box;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: transform 0.2s, border-color 0.2s;
    }

    .media-card:hover {
      transform: scale(1.03);
      border-color: var(--primary-color);
      background-color: var(--card-hover);
    }

    .media-service {
      font-size: 10px;
      color: var(--primary-color);
      font-weight: bold;
      text-transform: uppercase;
      background: rgba(0, 0, 0, 0.7);
      padding: 4px 6px;
      border-radius: 4px;
      align-self: flex-start;
      z-index: 2;
    }

    .media-poster-placeholder {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #1a1a1a 0%, #0d0d0d 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      color: #333333;
      font-size: 12px;
      z-index: 1;
    }

    .media-title-banner {
      font-size: 12px;
      color: var(--text-color);
      font-weight: bold;
      background: rgba(0, 0, 0, 0.85);
      padding: 6px 8px;
      border-radius: 4px;
      text-align: center;
      z-index: 2;
      width: 100%;
      box-sizing: border-box;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <!-- Login View Component -->
  <div id="loginContainer">
    <div class="media-search-box">Media Search</div>
    <div class="login-card">
      <h2>Enter Credentials</h2>
      <form id="loginForm">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="user" autocomplete="username" autofocus required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="pass" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn-action">Login</button>
        <div id="errorMsg">Invalid username or password</div>
      </form>
    </div>
  </div>

  <!-- Landing View Component -->
  <div id="landingContainer">
    <div class="landing-header">
      <div class="media-search-box landing-banner">Media Search</div>
      <button class="btn-action" id="logoffBtn" style="width: auto; padding: 10px 20px; font-size: 14px;">Logoff</button>
    </div>

    <div class="dashboard-content" id="dashboardRows">
      <!-- Category rows will be dynamically injected here -->
    </div>
  </div>

  <script>
    const AUTH_CONFIG = {
      user: "tsilva",
      pass: "1234"
    };

    const userServices = [
      { username: "tsilva", service: "Netflix", active: "Y" },
      { username: "tsilva", service: "Hulu", active: "Y" },
      { username: "tsilva", service: "Disney", active: "Y" },
      { username: "tsilva", service: "HBO Max", active: "Y" },
      { username: "tsilva", service: "Amazon Prime", active: "Y" },
      { username: "tsilva", service: "Paramount+", active: "Y" },
      { username: "tsilva", service: "Crunchyroll", active: "Y" }
    ];

    const allMediaCatalog = [
      { id: "81157729", service: "Netflix", title: "Rebel Ridge", releaseDate: "2024-09-06" },
      { id: "81476889", service: "Netflix", title: "The Killer", releaseDate: "2023-11-10" },
      { id: "81458471", service: "Netflix", title: "Glass Onion", releaseDate: "2022-12-23" },
      { id: "81582845", service: "Netflix", title: "Beverly Hills Cop: Axel F", releaseDate: "2024-07-03" },
      { id: "81223405", service: "Netflix", title: "Spaceman", releaseDate: "2024-03-01" },
      { id: "81483842", service: "Netflix", title: "Lift", releaseDate: "2024-01-12" },
      
      { id: "B09ZVDZGP8", service: "Amazon Prime", title: "Road House", releaseDate: "2024-03-21" },
      { id: "B0D1XD6V1G", service: "Amazon Prime", title: "The Idea of You", releaseDate: "2024-05-02" },
      { id: "B0DMV13W3C", service: "Amazon Prime", title: "Red One", releaseDate: "2024-11-15" },
      { id: "B0CSG69887", service: "Amazon Prime", title: "Role Play", releaseDate: "2024-01-12" },
      { id: "B09935H8V4", service: "Amazon Prime", title: "The Tomorrow War", releaseDate: "2021-07-02" },

      { id: "quiz-lady", service: "Hulu", title: "Quiz Lady", releaseDate: "2023-11-03" },
      { id: "prey", service: "Hulu", title: "Prey", releaseDate: "2022-08-05" },
      { id: "not-okay", service: "Hulu", title: "Not Okay", releaseDate: "2022-07-29" },
      { id: "boston-strangler", service: "Hulu", title: "Boston Strangler", releaseDate: "2023-03-17" },
      { id: "flamin-hot", service: "Hulu", title: "Flamin' Hot", releaseDate: "2023-06-09" },

      { id: "inside-out-2", service: "Disney", title: "Inside Out 2", releaseDate: "2024-06-14" },
      { id: "deadpool-and-wolverine", service: "Disney", title: "Deadpool & Wolverine", releaseDate: "2024-07-26" },
      { id: "elemental", service: "Disney", title: "Elemental", releaseDate: "2023-06-16" },
      { id: "peter-pan-and-wendy", service: "Disney", title: "Peter Pan & Wendy", releaseDate: "2023-04-28" },
      { id: "disenchanted", service: "Disney", title: "Disenchanted", releaseDate: "2022-11-18" },

      { id: "the-batman", service: "HBO Max", title: "The Batman", releaseDate: "2022-03-04" },
      { id: "dune-part-two", service: "HBO Max", title: "Dune: Part Two", releaseDate: "2024-03-01" },
      { id: "furiosa", service: "HBO Max", title: "Furiosa", releaseDate: "2024-05-24" },
      { id: "the-flash", service: "HBO Max", title: "The Flash", releaseDate: "2023-06-16" },
      { id: "blue-beetle", service: "HBO Max", title: "Blue Beetle", releaseDate: "2023-08-18" },

      { id: "top-gun-maverick", service: "Paramount+", title: "Top Gun: Maverick", releaseDate: "2022-05-27" },
      { id: "a-quiet-place-day-one", service: "Paramount+", title: "A Quiet Place: Day One", releaseDate: "2024-06-28" },
      { id: "if", service: "Paramount+", title: "IF", releaseDate: "2024-05-17" },
      { id: "mission-impossible-dead-reckoning", service: "Paramount+", title: "Mission: Impossible - Dead Reckoning", releaseDate: "2023-07-12" },
      { id: "babylon", service: "Paramount+", title: "Babylon", releaseDate: "2022-12-23" },

      { id: "demon-slayer-to-the-hashira-training", service: "Crunchyroll", title: "Demon Slayer: To the Hashira Training", releaseDate: "2024-02-23" },
      { id: "spy-x-family-code-white", service: "Crunchyroll", title: "SPY x FAMILY CODE: White", releaseDate: "2023-12-22" },
      { id: "haikyu-the-dumpster-battle", service: "Crunchyroll", title: "HAIKYU!! The Dumpster Battle", releaseDate: "2024-02-16" },
      { id: "jujutsu-kaisen", service: "Crunchyroll", title: "JUJUTSU KAISEN Hidden Inventory", releaseDate: "2023-07-06" },
      { id: "chainsaw-man", service: "Crunchyroll", title: "Chainsaw Man", releaseDate: "2022-10-12" }
    ];

    function getProviderUrl(item) {
      const q = encodeURIComponent(item.title);
      switch(item.service) {
        case "Netflix":
          return `https://www.netflix.com/title/${item.id}`;
        case "Amazon Prime":
          return `https://www.amazon.com/dp/${item.id}`;
        case "Disney":
          return `https://www.disneyplus.com/browse/${item.id}`;
        case "HBO Max":
          return `https://www.max.com/movies/${item.id}`;
        case "Hulu":
          return `https://www.hulu.com/movie/${item.id}`;
        case "Paramount+":
          return `https://www.paramountplus.com/movies/${item.id}`;
        case "Crunchyroll":
          return `https://www.crunchyroll.com/watch/${item.id}`;
        default:
          return `https://www.google.com/search?q=${q}+${encodeURIComponent(item.service)}`;
      }
    }

    function setViewState(isLoggedIn, username = "") {
      const loginContainer = document.getElementById('loginContainer');
      const landingContainer = document.getElementById('landingContainer');

      if (isLoggedIn) {
        if (loginContainer) loginContainer.style.display = 'none';
        if (landingContainer) landingContainer.style.display = 'block';
        renderDashboard(username);
      } else {
        if (landingContainer) landingContainer.style.display = 'none';
        if (loginContainer) loginContainer.style.display = 'flex';
      }
    }

    function renderDashboard(username) {
      const dashboard = document.getElementById('dashboardRows');
      if (!dashboard) return;
      dashboard.innerHTML = '';

      const activeServices = userServices
        .filter(s => s.username.toLowerCase() === username.toLowerCase() && s.active && s.active.toUpperCase() === 'Y')
        .map(s => s.service);

      const topNewArrivalsItems = [];
      
      activeServices.forEach(service => {
        const serviceItems = allMediaCatalog
          .filter(item => item.service === service)
          .sort((a, b) => new Date(b.releaseDate) - new Date(a.releaseDate))
          .slice(0, 5);
        
        topNewArrivalsItems.push(...serviceItems);
      });

      if (topNewArrivalsItems.length > 0) {
        const section = document.createElement('div');
        section.className = 'category-section';

        const titleDiv = document.createElement('div');
        titleDiv.className = 'section-title';
        titleDiv.textContent = "Top New Arrivals";
        section.appendChild(titleDiv);

        const row = document.createElement('div');
        row.className = 'row-container';

        topNewArrivalsItems.forEach(item => {
          const card = document.createElement('div');
          card.className = 'media-card';
          card.innerHTML = `
            <div class="media-poster-placeholder">Poster</div>
            <span class="media-service">${item.service}</span>
            <span class="media-title-banner" title="${item.title}">${item.title}</span>
          `;
          card.addEventListener('click', () => {
            window.open(getProviderUrl(item), '_blank');
          });
          row.appendChild(card);
        });

        section.appendChild(row);
        dashboard.appendChild(section);
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const urlUser = urlParams.get('user');
      const urlPass = urlParams.get('pass');

      if (urlUser && urlUser.toLowerCase() === AUTH_CONFIG.user && urlPass === AUTH_CONFIG.pass) {
        sessionStorage.setItem('loggedInUser', AUTH_CONFIG.user);
      }

      const savedUser = sessionStorage.getItem('loggedInUser');
      setViewState(!!savedUser, savedUser || AUTH_CONFIG.user);
    });

    const loginForm = document.getElementById('loginForm');
    if (loginForm) {
      loginForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const u = document.getElementById('username').value.trim().toLowerCase();
        const p = document.getElementById('password').value.trim();
        const err = document.getElementById('errorMsg');

        if (u === AUTH_CONFIG.user && p === AUTH_CONFIG.pass) {
          sessionStorage.setItem('loggedInUser', u);
          document.getElementById('password').value = '';
          if (err) err.style.display = 'none';
          setViewState(true, u);
        } else {
          if (err) err.style.display = 'block';
        }
      });
    }

    const logoffBtn = document.getElementById('logoffBtn');
    if (logoffBtn) {
      logoffBtn.addEventListener('click', () => {
        sessionStorage.removeItem('loggedInUser');
        setViewState(false);
        const uField = document.getElementById('username');
        if (uField) {
          uField.value = '';
          uField.focus();
        }
      });
    }
  </script>
</body>
</html>
