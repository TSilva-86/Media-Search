<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Media Search - Login</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #000000;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    #loginContainer {
      display: flex;
      flex-direction: column;
      width: 360px;
      gap: 12px;
    }

    .media-search-box {
      width: 100%;
      padding: 10px 16px;
      background-color: #28a745;
      color: #000000;
      font-weight: bold;
      font-size: 16px;
      text-align: center;
      border: 1px solid #218838;
      border-radius: 4px;
      box-sizing: border-box;
      box-shadow: 0 2px 5px rgba(0,0,0,0.15);
    }

    .login-card {
      width: 100%;
      background: #121212;
      padding: 24px;
      border-radius: 6px;
      border: 1px solid #333333;
      box-sizing: border-box;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    .login-card h2 {
      margin-top: 0;
      margin-bottom: 20px;
      font-size: 20px;
      color: #ffffff;
      text-align: center;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      color: #bbbbbb;
    }

    .form-group input {
      width: 100%;
      padding: 10px;
      font-size: 14px;
      background-color: #1e1e1e;
      color: #ffffff;
      border: 1px solid #444444;
      border-radius: 4px;
      box-sizing: border-box;
      outline: none;
    }

    .form-group input:focus {
      border-color: #28a745;
    }

    .btn-login {
      width: 100%;
      padding: 10px 16px;
      background-color: #28a745;
      color: #000000;
      font-weight: bold;
      font-size: 16px;
      border: 1px solid #218838;
      border-radius: 4px;
      cursor: pointer;
      box-sizing: border-box;
    }

    .btn-login:hover {
      background-color: #218838;
    }

    #errorMsg {
      color: #ff4d4d;
      font-size: 13px;
      text-align: center;
      margin-top: 10px;
      display: none;
    }
