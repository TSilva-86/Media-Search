<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Media Search</title>
  <style>
    :root {
      --bg-color: #000000;
      --card-bg: #121212;
      --card-hover: #181818;
      --primary-color: #28a745;
      --primary-hover: #218838;
      --text-color: #ffffff;
      --text-muted: #bbbbbb;
      --border-color: #333333;
      --error-color: #ff4d4d;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    #loginContainer {
      display: flex;
      flex-direction: column;
      width: 360px;
      gap: 12px;
    }

    .media-search-box {
      width: 100%;
      padding: 10px 16px;
      background-color: var(--primary-color);
      color: #000000;
      font-weight: bold;
      font-size: 16px;
      text-align: center;
      border: 1px solid var(--primary-hover);
      border-radius: 4px;
      box-sizing: border-box;
      box-shadow: 0 2px 5px rgba(0,0,0,0.15);
    }

    .login-card {
      width: 100%;
      background: var(--card-bg);
      padding: 24px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      box-sizing: border-box;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    .login-card h2 {
      margin-top: 0;
      margin-bottom: 20px;
      font-size: 20px;
      text-align: center;
    }

    .form-group {
      margin-bottom: 16px;
    }
