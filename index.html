<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Media Search - Login</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #000000;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    #loginContainer {
      display: flex;
      flex-direction: column;
      width: 360px;
      gap: 12px;
    }

    .media-search-box {
      width: 100%;
      padding: 10px 16px;
      background-color: #28a745;
      color: #000000;
      font-weight: bold;
      font-size: 16px;
      text-align: center;
      border: 1px solid #218838;
      border-radius: 4px;
      box-sizing: border-box;
      box-shadow: 0 2px 5px rgba(0,0,0,0.15);
    }

    .login-card {
      width: 100%;
      background: #121212;
      padding: 24px;
      border-radius: 6px;
      border: 1px solid #333333;
      box-sizing: border-box;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    .login-card h2 {
      margin-top: 0;
      margin-bottom: 20px;
      font-size: 20px;
      color: #ffffff;
      text-align: center;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      color: #bbbbbb;
    }

    .form-group input {
      width: 100%;
      padding: 10px;
      font-size: 14px;
      background-color: #1e1e1e;
      color: #ffffff;
      border: 1px solid #444444;
      border-radius: 4px;
      box-sizing: border-box;
      outline: none;
    }

    .form-group input:focus {
      border-color: #28a745;
    }

    .btn-login {
      width: 100%;
      padding: 10px 16px;
      background-color: #28a745;
      color: #000000;
      font-weight: bold;
      font-size: 16px;
      border: 1px solid #218838;
      border-radius: 4px;
      cursor: pointer;
      box-sizing: border-box;
    }

    .btn-login:hover {
      background-color: #218838;
    }

    #errorMsg {
      color: #ff4d4d;
      font-size: 13px;
      text-align: center;
      margin-top: 10px;
      display: none;
    }

    #landingContainer {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #000000;
      box-sizing: border-box;
      padding: 20px;
      overflow-y: auto;
    }

    .landing-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }

    .landing-banner {
      width: 220px;
    }

    .btn-logoff {
      padding: 10px 20px;
      background-color: #28a745;
      color: #000000;
      font-weight: bold;
      font-size: 14px;
      border: 1px solid #218838;
      border-radius: 4px;
      cursor: pointer;
      box-sizing: border-box;
    }

    .btn-logoff:hover {
      background-color: #218838;
    }

    .section-banner {
      width: 220px;
      margin-top: 25px;
      margin-bottom: 15px;
    }

    .carousel-wrapper {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      max-width: 1100px;
    }

    .carousel-btn {
      background-color: #121212;
      color: #ffffff;
      border: 1px solid #333333;
      font-size: 20px;
      font-weight: bold;
      width: 44px;
      height: 110px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-shrink: 0;
    }

    .carousel-btn:hover {
      background-color: #28a745;
      color: #000000;
      border-color: #218838;
    }

    .scroll-container {
      display: flex;
      gap: 16px;
      overflow: hidden;
      width: 100%;
      padding: 5px 0;
    }

    .media-card {
      flex: 0 0 180px;
      height: 110px;
      background-color: #121212;
      border: 1px solid #333333;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 12px;
      text-align: center;
      box-sizing: border-box;
      cursor: pointer;
      transition: border-color 0.2s, background-color 0.2s;
    }

    .media-card:hover {
      border-color: #28a745;
      background-color: #181818;
    }

    .media-service {
      font-size: 11px;
      color: #28a745;
      font-weight: bold;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .media-title {
      font-size: 13px;
      color: #ffffff;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- Login View -->
  <div id="loginContainer">
    <div class="media-search-box">Media Search</div>

    <div class="login-card">
      <h2>Enter Credentials</h2>
      
      <form id="loginForm">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="user" autocomplete="username" autofocus required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="pass" autocomplete="current-password" required>
        </div>

        <button type="submit" class="btn-login">Login</button>
        <div id="errorMsg">Invalid username or password</div>
      </form>
    </div>
  </div>

  <!-- Landing Page View -->
  <div id="landingContainer">
    <div class="landing-header">
      <div class="media-search-box landing-banner">Media Search</div>
      <button class="btn-logoff" id="logoffBtn">Logoff</button>
    </div>

    <!-- Top New Arrivals Section -->
