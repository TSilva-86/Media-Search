<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Search & Tracking Hub</title>
    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --primary-green: #2ecc71;
            --primary-green-hover: #27ae60;
            --text-main: #ffffff;
            --text-muted: #b0b0b0;
            --border-color: #333333;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Login Screen Styles */
        #login-screen {
            background: var(--surface-color);
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
            border: 1px solid var(--border-color);
        }

        h2 {
            margin-top: 0;
            color: var(--text-main);
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-muted);
            font-size: 14px;
        }

        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            background: #2a2a2a;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 4px;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: var(--primary-green);
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-green);
            color: #000;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: var(--primary-green-hover);
        }

        .error-msg {
            color: #e74c3c;
            font-size: 14px;
            text-align: center;
            margin-top: 10px;
            display: none;
        }

        /* Main Dashboard Styles */
        #dashboard-screen {
            display: none;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }

        .logout-btn {
            width: auto;
            padding: 8px 16px;
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: 14px;
        }

        .logout-btn:hover {
            background: #333;
            color: var(--text-main);
        }

        .filters {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .filter-btn {
            width: auto;
            padding: 8px 14px;
            background: var(--surface-color);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            font-size: 14px;
            font-weight: normal;
            cursor: pointer;
        }

        .filter-btn.active {
            background: var(--primary-green);
            color: #000;
            border-color: var(--primary-green);
            font-weight: bold;
        }

        /* Media Grid & Branded Service Tiles */
        .media-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        .media-card {
            background: var(--surface-color);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .media-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.4);
        }

        /* Service Brand Banner Area */
        .service-banner {
            height: 140px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 15px;
            text-align: center;
            position: relative;
        }

        .service-banner span {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .service-banner .sub-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 4px;
            opacity: 0.8;
        }

        /* Service Specific Color Themes */
        .theme-netflix { background: linear-gradient(135deg, #b9090b, #e50914); color: #fff; }
        .theme-prime { background: linear-gradient(135deg, #00a8e1, #146eb4); color: #fff; }
        .theme-hulu { background: linear-gradient(135deg, #1ce783, #107c41); color: #000; }
        .theme-disney { background: linear-gradient(135deg, #1136b8, #0063e5); color: #fff; }
        .theme-hbo { background: linear-gradient(135deg, #4b286d, #833ab4); color: #fff; }
        .theme-paramount { background: linear-gradient(135deg, #0064ff, #001f5c); color: #fff; }
        .theme-crunchyroll { background: linear-gradient(135deg, #f47521, #d64000); color: #fff; }

        /* Title Box matching the page style */
        .media-info {
            padding: 12px;
            background: var(--surface-color);
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex-grow: 1;
        }

        .media-title {
            font-size: 14px;
            font-weight: bold;
            color: var(--text-main);
            margin-bottom: 6px;
        }

        .media-meta {
            font-size: 12px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- LOGIN SCREEN -->
        <div id="login-screen">
            <h2>Media Hub Login</h2>
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Enter username">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter password">
            </div>
            <button onclick="handleLogin()">Sign In</button>
            <div id="error-msg" class="error-msg">Invalid username or password.</div>
        </div>

        <!-- DASHBOARD SCREEN -->
        <div id="dashboard-screen">
            <div class="header-bar">
                <h2>Top New Arrivals</h2>
                <button class="logout-btn" onclick="handleLogout()">Sign Out</button>
            </div>

            <!-- Service Filters -->
            <div id="filters-container" class="filters">
                <!-- Populated dynamically based on user active services -->
            </div>

            <!-- Media Grid -->
            <div id="media-grid" class="media-grid">
                <!-- Populated dynamically -->
            </div>
        </div>
    </div>

    <script>
        const AUTH_CONFIG = {
            user: "tsilva",
            pass: "1234"
        };

        const userServices = [
            { username: "tsilva", service: "Netflix", active: "Y" },
            { username: "tsilva", service: "Hulu", active: "Y" },
            { username: "tsilva", service: "Disney+", active: "Y" },
            { username: "tsilva", service: "HBO Max", active: "Y" },
            { username: "tsilva", service: "Amazon Prime", active: "Y" },
            { username: "tsilva", service: "Paramount+", active: "Y" },
            { username: "tsilva", service: "Crunchyroll", active: "Y" }
        ];

        const allMediaCatalog = [
            { service: "Netflix", title: "Rebel Ridge", releaseDate: "2024-09-06" },
            { service: "Netflix", title: "The Killer", releaseDate: "2023-11-10" },
            { service: "Netflix", title: "Glass Onion", releaseDate: "2022-12-23" },
            { service: "Amazon Prime", title: "Road House", releaseDate: "2024-03-21" },
            { service: "Amazon Prime", title: "The Idea of You", releaseDate: "2024-05-02" },
            { service: "Hulu", title: "Quiz Lady", releaseDate: "2023-11-03" },
            { service: "Hulu", title: "Prey", releaseDate: "2022-08-05" },
            { service: "Disney+", title: "Inside Out 2", releaseDate: "2024-06-14" },
            { service: "Disney+", title: "Deadpool & Wolverine", releaseDate: "2024-07-26" },
            { service: "HBO Max", title: "The Batman", releaseDate: "2022-03-04" },
            { service: "HBO Max", title: "Dune: Part Two", releaseDate: "2024-03-01" },
            { service: "Paramount+", title: "Top Gun: Maverick", releaseDate: "2022-05-27" },
            { service: "Paramount+", title: "A Quiet Place: Day One", releaseDate: "2024-06-28" },
            { service: "Crunchyroll", title: "Demon Slayer: Hashira Training", releaseDate: "2024-02-23" }
        ];

        let currentFilter = "All";

        function handleLogin() {
            const user = document.getElementById("username").value.trim();
            const pass = document.getElementById("password").value.trim();
            const errorMsg = document.getElementById("error-msg");

            if (user === AUTH_CONFIG.user && pass === AUTH_CONFIG.pass) {
                document.getElementById("login-screen").style.display = "none";
                document.getElementById("dashboard-screen").style.display = "block";
                initDashboard();
            } else {
                errorMsg.style.display = "block";
            }
        }

        function handleLogout() {
            document.getElementById("username").value = "";
            document.getElementById("password").value = "";
            document.getElementById("error-msg").style.display = "none";
            document.getElementById("dashboard-screen").style.display = "none";
            document.getElementById("login-screen").style.display = "block";
        }

        function getServiceThemeClass(serviceName) {
            switch(serviceName.toLowerCase()) {
                case 'netflix': return 'theme-netflix';
                case 'amazon prime': return 'theme-prime';
                case 'hulu': return 'theme-hulu';
                case 'disney+': return 'theme-disney';
                case 'hbo max': return 'theme-hbo';
                case 'paramount+': return 'theme-paramount';
                case 'crunchyroll': return 'theme-crunchyroll';
                default: return 'theme-netflix';
            }
        }

        function initDashboard() {
            renderFilters();
            renderMedia();
        }

        function renderFilters() {
            const container = document.getElementById("filters-container");
            const activeServices = userServices.filter(s => s.active === "Y").map(s => s.service);
            
            let html = `<button class="filter-btn ${currentFilter === 'All' ? 'active' : ''}" onclick="setFilter('All')">All</button>`;
            activeServices.forEach(srv => {
                html += `<button class="filter-btn ${currentFilter === srv ? 'active' : ''}" onclick="setFilter('${srv}')">${srv}</button>`;
            });
            container.innerHTML = html;
        }

        function setFilter(serviceName) {
            currentFilter = serviceName;
            renderFilters();
            renderMedia();
        }

        function renderMedia() {
            const grid = document.getElementById("media-grid");
            const activeServices = userServices.filter(s => s.active === "Y").map(s => s.service);
            
            let filtered = allMediaCatalog.filter(item => activeServices.includes(item.service));
            if (currentFilter !== "All") {
                filtered = filtered.filter(item => item.service === currentFilter);
            }

            if (filtered.length === 0) {
                grid.innerHTML = `<p style="color: var(--text-muted);">No media items found for this selection.</p>`;
                return;
            }

            let html = "";
            filtered.forEach(item => {
                const themeClass = getServiceThemeClass(item.service);
                html += `
                    <div class="media-card">
                        <div class="service-banner ${themeClass}">
                            <span>${item.service}</span>
                            <span class="sub-label">New Arrival</span>
                        </div>
                        <div class="media-info">
                            <div class="media-title">${item.title}</div>
                            <div class="media-meta">Released: ${item.releaseDate}</div>
                        </div>
                    </div>
                `;
            });
            grid.innerHTML = html;
        }

        // Allow pressing Enter to login
        document.addEventListener("keydown", function(event) {
            if (event.key === "Enter" && document.getElementById("login-screen").style.display !== "none") {
                handleLogin();
            }
        });
    </script>
</body>
</html>
